function timelineHtml(y, m) {
  const c = calc(y, m), days = c.days, [ty, tm, td] = todayYM(), isCur = y === ty && m === tm;
  const fx = c.fixedItems.filter(f => fxAmt(f, m) && isActive(f)).map(f => ({ d: payDay(f.결제일, y, m) || 1, name: f.항목, amt: fxAmt(f, m), inst: false }));
  const inst = c.exAll.filter(t => t.할부ID).map(t => ({ d: +t.날짜.slice(8, 10), name: t.내용 || t.소분류, amt: t.금액, inst: true }));
  const all = fx.concat(inst);
  if (!all.length) return '<div class="empty">이번 달 결제가 없어요</div>';
  const mx = Math.max(...all.map(x => x.amt));
  const pos = d => ((d - 1) / Math.max(1, days - 1)) * 100;
  const byDay = new Map(); all.forEach(x => { if (!byDay.has(x.d)) byDay.set(x.d, []); byDay.get(x.d).push(x); });
  // 금액 큰 날부터 라벨을 붙이되, 이미 붙은 라벨과 14% 이상 떨어진 날만 (겹침 방지)
  const big = [];
  [...byDay.entries()].map(([d, arr]) => ({ d, v: sum(arr, x => x.amt) })).sort((a, b) => b.v - a.v)
    .forEach(x => { if (big.length < 5 && big.every(d => Math.abs(pos(d) - pos(x.d)) >= 14)) big.push(x.d); });
  const labX = d => { const p = pos(d); return p < 6 ? `left:${p}%;transform:none;text-align:left` : p > 94 ? `left:auto;right:${100 - p}%;transform:none;text-align:right` : `left:${p}%`; };
  return `<div class="tl">
    <div class="axis"></div>${isCur ? `<div class="done" style="width:${pos(td)}%"></div><div class="now" style="left:${pos(td)}%"></div>` : ''}
    ${all.map(x => { const s = 8 + 18 * Math.sqrt(x.amt / mx); return `<span class="pt ${x.inst ? 'inst' : ''} ${isCur && x.d < td ? 'past' : ''}" style="left:${pos(x.d)}%;width:${s}px;height:${s}px" title="${m}/${x.d} ${esc(x.name)} ${won(x.amt)}"></span>`; }).join('')}
    ${big.map(d => { const arr = byDay.get(d).sort((a, b) => b.amt - a.amt); return `<span class="lab" style="${labX(d)}">${d}일 ${esc(arr[0].name)}${arr.length > 1 ? ` 외 ${arr.length - 1}` : ''}<br><b>${man(sum(arr, x => x.amt))}</b></span>`; }).join('')}
    ${[1, 5, 10, 15, 20, 25, days].map(d => `<span class="day" style="${labX(d)}">${d}일</span>`).join('')}
  </div>`;
}

/** 연간 결산표에 보일 달(0부터) — all 1~12월 · h1 상반기 · h2 하반기 · recent 지난 3개월(이번 달 포함) */
function yearRangeMonths(r, n) {
  const all = [...Array(12)].map((_, i) => i);
  if (r === 'h1') return all.slice(0, 6);
  if (r === 'h2') return all.slice(6);
  if (r === 'recent') return all.slice(Math.max(0, n - 3), Math.max(3, n));
  return all;
}
/* 좁은 화면용 월별 요약 카드 (최근 달부터) */
function yearMonthCards(done) {
  if (!done.length) return '<div class="empty">아직 기록이 없어요</div>';
  return [...done].reverse().map(c => {
    const parts = [{ label: '고정', v: c.fixed, c: css('--c-fixed') }, { label: '변동', v: c.variable, c: css('--c-var') }, { label: '저축', v: c.saving, c: css('--c-save') }];
    return `<div class="ym-card"><div class="between"><b>${c.m}월</b><span class="small">수입 <b>${w(c.income)}</b></span></div>
      ${stackBar(parts.concat([{ label: '남은 돈', v: Math.max(0, c.gap), c: css('--c-left') }]), Math.max(c.income, c.fixed + c.variable + c.saving))}
      <div class="ym-nums">${parts.map(p => `<span><i class="dot" style="background:${p.c}"></i>${p.label} ${man(p.v)}</span>`).join('')}<span style="${c.gap < 0 ? 'color:var(--bad-ink)' : ''}">${c.gap < 0 ? '부족' : '남음'} <b>${man(Math.abs(c.gap))}</b></span></div></div>`;
  }).join('');
}

};

/* ═════════════ 7. 설정 ═════════════ */
const REF_TYPES = [['지출', '지출 분류 (분류 › 세부)'], ['수입', '수입 항목'], ['고정대분류', '고정지출 분류'], ['결제수단', '결제수단'], ['지출평가', '지출 성격'], ['포인트구분', '복지포인트 구분'], ['저축항목', '저축 항목']];
function getTheme() { let t = 'light'; try { const v = localStorage.getItem('theme'); if (v !== null) t = v; } catch (e) {} return t; }
function vSet() {
  if (!S.refDraft) S.refDraft = D().기준정보.map(r => Object.assign({}, r));
  const R = S.refDraft, theme = getTheme();
  const chip = (i, label) => `<span class="chip">${esc(label)} <a onclick="refDel(${i})" class="muted">✕</a></span>`;
  const block = ([t, title]) => {
    const rows = R.map((r, i) => [r, i]).filter(([r]) => r.유형 === t);
    let body;
    if (t === '지출' || t === '수입') {
      body = uniq(rows.map(([r]) => r.대분류)).map(b => `<div style="margin-bottom:10px"><b class="small">${esc(b)}</b><div class="chips" style="margin-top:5px">${rows.filter(([r]) => r.대분류 === b).map(([r, i]) => chip(i, r.소분류)).join('')}</div></div>`).join('') +
        `<div class="row mt"><input class="inp" placeholder="분류" id="rb_${t}" ${t === '수입' ? 'value="수입"' : ''}><input class="inp" placeholder="세부" id="rs_${t}"><button class="btn sm" onclick="refAdd('${t}',true)">추가</button></div>`;
    } else {
      body = `<div class="chips">${rows.map(([r, i]) => chip(i, r.대분류)).join('')}</div>
        <div class="row mt"><input class="inp grow" placeholder="새 항목" id="rb_${t}"><button class="btn sm" onclick="refAdd('${t}',false)">추가</button></div>`;
    }
    return `<div class="card c6 keep w4"><div class="card-h"><h3>${title}</h3></div>${body}</div>`;
  };
  return `
  <div class="g">
    <div class="card c6 keep"><div class="card-h"><h3>목표 · 계산</h3></div>
      ${privateAsset(`<div class="field"><label>목표 순자산</label><input class="inp money" id="sGoal" value="${num(setting('목표순자산')) || ''}" placeholder="미설정"></div>
      <div class="field"><label>기준 순자산 (목표 진행률 출발점)</label><input class="inp money" id="sBase" value="${num(setting('기준순자산')) || ''}" placeholder="미설정 — 0원에서 출발"></div>`)}
      <label class="row small" style="margin-bottom:14px"><input type="checkbox" id="sPt" ${String(setting('포인트결제_지출제외') || 'Y') === 'Y' ? 'checked' : ''}> 복지포인트 결제는 지출 합계에서 제외</label>
      <button class="btn" id="sSave">저장</button></div>
    <div class="card c6 keep"><div class="card-h"><h3>화면 · 데이터</h3></div>
      <div class="field"><label>테마</label><div class="seg" id="sTheme">${[['light', '라이트'], ['dark', '다크'], ['', '시스템 따라가기']].map(([v, l]) => `<button data-v="${v}" class="${theme === v ? 'on' : ''}">${l}</button>`).join('')}</div></div>
      <div class="field"><label>데이터</label><div class="small sub">거래 ${D().거래내역.length}건 · 고정지출 ${D().고정지출.length}개<span class="asset-record-count"> · 자산기록 ${D().자산.length}건</span></div>
        <div class="row mt">${D().url ? `<a class="btn sm ghost" style="text-decoration:none" href="${esc(D().url)}" target="_blank">구글시트 원본 ↗</a>` : ''}<button class="btn sm ghost" id="sReload">새로고침</button></div></div></div>
  </div>
  <div class="sec-title"><h2>분류 기준정보</h2><p>입력 화면의 선택지가 여기서 정해져요</p><button class="btn sm" id="refSave">기준정보 저장</button></div>
  <div class="g">${REF_TYPES.map(block).join('')}</div>
  <div class="sec-title"><h2>휴대폰 앱 연결</h2><p>앱에서 이 가계부를 쓰려면 기기를 등록하세요. 잃어버린 기기는 바로 해지할 수 있어요</p></div>
  <div class="g"><div class="card c12 keep" id="devCard"><div class="small muted">불러오는 중…</div></div></div>`;
}
/* 휴대폰 앱(PWA) 기기 관리 — 키 비밀값은 등록 직후 한 번만 보여 주고 서버에는 해시만 남음 */
function devCardHtml(info) {
  const ds = info.devices || [];
  return `<div class="field"><label>앱 접속 주소 <span class="muted">(앱용 공개 배포의 …/exec 주소 · 한 번만 넣으면 돼요)</span></label>
      <div class="row"><input class="inp grow" id="apiUrl" value="${esc(info.apiUrl || '')}" placeholder="https://script.google.com/macros/s/…/exec"><button class="btn sm ghost" id="apiUrlSave">저장</button></div></div>
    <div class="field"><label>연결된 기기 ${ds.length}대</label>
      ${ds.length ? `<div class="tbl-wrap"><table><thead><tr><th>기기</th><th>등록</th><th>마지막 사용</th><th></th></tr></thead><tbody>
        ${ds.map(d => `<tr><td>${esc(d.name)}</td><td class="small">${esc(d.created)}</td><td class="small">${esc(d.last || '아직 없음')}</td>
          <td style="text-align:right"><button class="btn sm ghost" data-dev-del="${esc(d.id)}" data-dev-name="${esc(d.name)}">해지</button></td></tr>`).join('')}
      </tbody></table></div>` : '<div class="small muted">아직 연결된 기기가 없어요.</div>'}</div>
    <div class="row"><input class="inp grow" id="devName" maxlength="30" placeholder="기기 이름 (예: 내 폴드7)"><button class="btn sm" id="devAdd">기기 등록</button></div>`;
}
// 연결 코드 = 'BG1.' + base64url({u: 앱 접속 주소, k: 기기 키}) — 앱의 ‘내 가계부 연결’에 붙여 넣음 (pwa/bridge.js 가 풀어 씀)
const connCode = (u, k) => 'BG1.' + btoa(JSON.stringify({ u, k })).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
async function loadDevices() {
  const box = $('#devCard'); if (!box) return;
  if (window.__appConn) {   // 휴대폰 앱 안: 기기 관리는 PC에서, 여기서는 이 기기 연결만 끊을 수 있음
    box.innerHTML = `<div class="small sub">이 기기는 가계부에 연결돼 있어요. 기기 등록·해지는 PC 설정 화면에서 해요.</div>
      <div class="row mt"><button class="btn sm ghost" id="appDisconnect">이 기기 연결 끊기</button></div>`;
    $('#appDisconnect').onclick = async () => {
      if (!(await ask('이 기기의 연결을 끊을까요?\n기기에 저장된 가계부 사본도 지워져요. 다시 쓰려면 연결 코드가 필요해요.', '연결 끊기', true))) return;
      window.__appConn.clear(); location.replace(location.pathname);
    };
    return;
  }
  let info;
  try { info = await api('listDevices'); } catch (e) { box.innerHTML = `<div class="small muted">기기 목록을 불러오지 못했어요: ${esc(e && e.message || e)}</div>`; return; }
  if (!info || !Array.isArray(info.devices)) info = { apiUrl: '', devices: [] };
  if (!$('#devCard')) return;
  box.innerHTML = devCardHtml(info); initTables(box);
  $('#apiUrlSave').onclick = async () => { await call('setApiUrl', $('#apiUrl').value.trim()); toast('앱 접속 주소를 저장했어요'); loadDevices(); };
  $('#devAdd').onclick = async () => {
    const name = $('#devName').value.trim(); if (!name) return toast('기기 이름을 입력하세요');
    if (!info.apiUrl) return toast('앱 접속 주소를 먼저 저장하세요');
    const r = await call('registerDevice', name), code = connCode(r.apiUrl, r.key);
    openModal('기기 등록 완료', `<p class="small">‘${esc(r.name)}’ 연결 코드예요. <b>지금 한 번만 보여요.</b> 휴대폰 앱의 ‘내 가계부 연결’에 붙여 넣으세요.<br>
      이 코드가 있으면 가계부를 볼 수 있으니 다른 사람에게 보여 주지 마세요. 휴대폰으로 옮길 때는 나에게 보내기처럼 나만 보는 곳을 쓰고, 연결 후 지워 주세요.</p>
      <textarea class="inp" id="devKey" rows="4" readonly style="width:100%;font-family:monospace;font-size:12px">${esc(code)}</textarea>
      <div class="row mt"><button class="btn" id="devCopy">코드 복사</button><button class="btn ghost" onclick="closeModal()">닫기</button></div>`);
    $('#devCopy').onclick = () => { $('#devKey').select(); try { navigator.clipboard.writeText(code).then(() => toast('복사했어요')); } catch (e) { document.execCommand('copy'); toast('복사했어요'); } };
    loadDevices();
  };
  $$('[data-dev-del]', box).forEach(b => (b.onclick = async () => {
    if (!(await ask(`‘${b.dataset.devName}’ 기기 연결을 해지할까요?\n해지하면 그 기기의 앱에서는 더 이상 가계부를 볼 수 없어요.`, '해지', true))) return;
    await call('revokeDevice', b.dataset.devDel); toast('해지했어요'); loadDevices();
  }));
}
function refDel(i) { S.refDraft.splice(i, 1); render(); }
function refAdd(t, two) {
  const b = $('#rb_' + t).value.trim(), s = two ? $('#rs_' + t).value.trim() : '';
  if (!b || (two && !s)) return toast('값을 입력하세요');
  S.refDraft.push({ 유형: t, 대분류: b, 소분류: s }); render();
}
vSet.after = () => {
  $('#sSave').onclick = async () => {
    const map = await call('saveSettings', { 목표순자산: num($('#sGoal').value), 기준순자산: num($('#sBase').value), 포인트결제_지출제외: $('#sPt').checked ? 'Y' : 'N' });
    D().설정 = Object.keys(map).map(k => ({ 키: k, 값: map[k] })); toast('설정 저장했어요');
  };
  $('#refSave').onclick = async () => { await call('saveRef', S.refDraft); D().기준정보 = S.refDraft.map(r => Object.assign({}, r)); toast('기준정보 저장했어요'); };
  $$('#sTheme button').forEach(b => (b.onclick = () => { applyTheme(b.dataset.v); render(); }));
  $('#sReload').onclick = () => load();
  loadDevices();
};
function applyTheme(v) {
  try { localStorage.setItem('theme', v); } catch (e) {}
  if (v) document.documentElement.setAttribute('data-theme', v); else document.documentElement.removeAttribute('data-theme');
  initChartDefaults();
}

/* 모바일 더보기 */
function vMore() {
  return `<div class="card">${[['close', '월 마감 점검', '이번 달 마감 전에 확인할 것'], ['review', '분류 검토함', '미분류·자동 제안·중복 의심 정리'], ['fixed', '고정지출', '구독·월세·보험 관리'], ['goal', '예산·저축 목표', '이번 달 예산과 저축 계획'], ['year', '연간 결산', '1년 한눈에 보기'], ['set', '설정', '분류·목표·테마']].map(([v, t, s]) =>
    `<div class="li click" onclick="go('${v}')"><div class="main"><b>${t}</b><small>${s}</small></div><span class="muted">›</span></div>`).join('')}</div>`;
}

/* ═════════════ 시작 ═════════════ */
// 이 브라우저의 마지막 화면만 먼저 표시한다. 서버 재확인 전에는 저장하지 않는다.
const SNAPSHOT_KEY = 'budget.snapshot.v1.app';
const SNAPSHOT_SHEETS = ['거래내역','고정지출','저축','목표','자산','포인트','메모','기준정보','설정'];
function clearSnapshot() { try { localStorage.removeItem(SNAPSHOT_KEY); } catch(e) {} }
function writeSnapshot() {
  if (!S.data || S.snapshotOnly) return;
  try { localStorage.setItem(SNAPSHOT_KEY, JSON.stringify({at:Date.now(),data:S.data})); } catch(e) { clearSnapshot(); }
}
function readSnapshot() {
  try {
    const snapshot=JSON.parse(localStorage.getItem(SNAPSHOT_KEY));
    if (!snapshot || !snapshot.data || !Number.isFinite(snapshot.at) || snapshot.at>Date.now() || Date.now()-snapshot.at>7*86400000 ||
        !SNAPSHOT_SHEETS.every(k=>Array.isArray(snapshot.data[k])) || !/^\d{4}-\d{2}-\d{2}$/.test(snapshot.data.today)) return null;
    return snapshot;
  } catch(e) { return null; }
}
function applySnapshotState() {
  $('#view').inert=!!S.snapshotOnly;
  $('#sideAdd').disabled=$('#mAdd').disabled=!!S.snapshotOnly || !S.data;
}
function showSnapshot() {
  const snapshot=readSnapshot();
  if (!snapshot) { applySnapshotState(); return; }
  S.data=snapshot.data; S.snapshotOnly=true;
  S.today=isoOf(new Date()); S.y=+S.today.slice(0,4); S.m=+S.today.slice(5,7);
  render();
  setSync('이전 화면 · 최신 내역 확인 중');
}
async function load() {
  if (S.loading) return;
  S.loading=true; S.snapshotOnly=!!S.data; applySnapshotState();
  setSync(S.data?'이전 화면 · 최신 내역 확인 중':'최신 내역 연결 중…');
  try {
    const fresh=await api('getData', false);
    if (!fresh.stocks && S.data && S.data.stocks) fresh.stocks=S.data.stocks;
    S.data=fresh; S.snapshotOnly=false;
    S.today=S.data.today;
    if (!S.y) { S.y=+S.today.slice(0,4); S.m=+S.today.slice(5,7); }
    S.refDraft=null;
    render(); writeSnapshot();
    setSync('동기화 ' + new Date().toTimeString().slice(0,5));
    // 시세 조회는 가계부 화면 표시를 기다리게 하지 않는다.
    refreshStartupStocks();
  } catch(e) {
    if (S.data) {
      S.snapshotOnly=true; applySnapshotState();
      setSync('이전 화면 · 연결 실패');
      toast('이전 내역을 보고 있어요. 연결 후 새로고침해 주세요.');
    } else {
      $('#view').innerHTML=`<div class="card empty">내역을 연결하지 못했어요.<br><small>${esc(e && e.message ? e.message : e)}</small><br><button class="btn sm mt" id="retryLoad">다시 연결</button></div>`;
      $('#retryLoad').onclick=load;
      setSync('연결 실패');
    }
  } finally { S.loading=false; }
}
async function refreshStartupStocks() {
  const revision=S.stockRevision||0;
  try {
    const stocks=await api('getStockPortfolio');
    if ((S.stockRevision||0)!==revision) return;
    S.data.stocks=stocks; writeSnapshot();
    if (S.view==='home' && $('#homeAssetsBody')) {
      updateHomeAssets();
    } else if (S.view==='asset' && $('#stockPending')) {
      $('#stockPending').outerHTML=stockPanelHtml(); initStocksPanel();
      // 주식계좌 연결 정보가 생겼으니 '대체됨' 표시를 위해 자산 목록도 다시 그림
      if ($('.asset-manager')) { $('.asset-manager').outerHTML=assetManagerHtml(); initAssetManager(); applyAssetPrivacy(); }
      updateAssetNow();
    } else if (S.view==='asset' && $('#stockLive')) {
      // 입금액·종목 입력 중인 폼은 그대로 둔다.
      $('#stockLive').innerHTML=stockLiveHtml(); updateAssetNow();
    }
  } catch(e) { /* 가계부 조회 성공을 시세 연결 오류로 덮어쓰지 않는다. */ }
}

document.addEventListener('DOMContentLoaded', () => {
  // 테마 기본값은 라이트 — 크롬/OS가 다크여도 밝게 (설정에서 '시스템 따라가기' 가능)
  const t = getTheme();
  if (t) document.documentElement.setAttribute('data-theme', t);
  applyAssetPrivacy();
  $('#assetPrivacyToggle').onclick = toggleAssetPrivacy;
  initChartDefaults();
  $$('#nav a, #tabbar a').forEach(a => (a.onclick = () => go(a.dataset.view)));
  $('#prevM').onclick = () => shiftMonth(-1);
  $('#nextM').onclick = () => shiftMonth(1);
  $('#thisM').onclick = async () => { if (!(await guardLeave())) return; S.dirty = null; S.y = +S.today.slice(0, 4); S.m = +S.today.slice(5, 7); S.selDay = null; render(); };
  $('#sideAdd').onclick = () => { if (S.data && !S.snapshotOnly) openTxForm(); };
  $('#mAdd').onclick = () => { if (S.data && !S.snapshotOnly) openTxForm(); };
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal' || e.target.closest('[data-close]')) closeModal(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
    if ((e.key === 'n' || e.key === 'N') && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && $('#modal').hidden && S.data && !S.snapshotOnly) { e.preventDefault(); openTxForm(); }
  });
  showSnapshot();
  load();
  initHistory();
});
</script>

</body>
</html>
