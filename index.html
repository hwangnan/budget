  padding: 26px 22px 22px; box-shadow: 0 10px 30px -18px rgba(16,32,72,.35); animation: acIn .45s cubic-bezier(.2,.8,.2,1); }
@keyframes acIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* ── tokens: 따뜻한 종이 톤 + 잉크, 데이터 색은 dataviz 기준 팔레트 ── */
:root {
  color-scheme: light;
  --page: #f4f3ef; --surface: #fcfcfb; --surface-2: #f1f0ec; --surface-3: #e9e8e3;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --line: rgba(11,11,11,.10);
  --accent: #2a78d6; --accent-ink: #1c5cab; --accent-soft: #e6effb;
  /* 돈의 성격 (전 화면 공통) */
  --c-fixed: #6250d6; --c-var: #eb6834; --c-save: #1baf7a; --c-left: #c3c2b7; --c-income: #0b0b0b;
  /* 상태 (아이콘+라벨과 함께만 사용) */
  --good: #0ca30c; --good-ink: #006300; --warn: #fab219; --warn-ink: #8a5a00; --bad: #d03b3b; --bad-ink: #b42a2a;
  /* sequential (blue) */
  --s1: #cde2fb; --s2: #9ec5f4; --s3: #6da7ec; --s4: #3987e5; --s5: #1c5cab;
  --r: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #222220; --surface-3: #2c2c2a;
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --line: rgba(255,255,255,.10);
    --accent: #3987e5; --accent-ink: #86b6ef; --accent-soft: #1b2a3f;
    --c-fixed: #9085e9; --c-var: #d95926; --c-save: #199e70; --c-left: #4a4a46; --c-income: #f0efec;
    --good-ink: #0ca30c; --warn-ink: #fab219; --bad-ink: #e66767;
    --s1: #184f95; --s2: #1c5cab; --s3: #256abf; --s4: #3987e5; --s5: #86b6ef;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #222220; --surface-3: #2c2c2a;
  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --line: rgba(255,255,255,.10);
  --accent: #3987e5; --accent-ink: #86b6ef; --accent-soft: #1b2a3f;
  --c-fixed: #9085e9; --c-var: #d95926; --c-save: #199e70; --c-left: #4a4a46; --c-income: #f0efec;
  --good-ink: #0ca30c; --warn-ink: #fab219; --bad-ink: #e66767;
  --s1: #184f95; --s2: #1c5cab; --s3: #256abf; --s4: #3987e5; --s5: #86b6ef;
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--ink); }
body { font: 14px/1.55 Pretendard, system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; -webkit-font-smoothing: antialiased; letter-spacing: -.005em; }
button, input, select, textarea { font: inherit; color: inherit; }
a { cursor: pointer; color: inherit; }
.tnum { font-variant-numeric: tabular-nums; }
h1, h2, h3, h4 { letter-spacing: -.02em; }

/* 미국주식 입력 */
.stock-links { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 16px 0 0; min-width: 0; }
.stock-panel #stockRows .inp { min-width: 95px; }
.stock-panel #stockNotice { margin-top: 8px; color: var(--ink-2); }
.stock-panel > .card-h { flex-wrap: wrap; gap: 12px; }
/* ── layout ── */
.app { display: grid; grid-template-columns: 228px minmax(0,1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; padding: 26px 16px 18px; display: flex; flex-direction: column; border-right: 1px solid var(--line); }
.brand { display: flex; gap: 13px; align-items: center; padding: 2px 7px 28px; color: var(--ink); }
.brand-symbol { display: block; width: 32px; height: 36px; flex: none; }
.brand-type { min-width: 0; }
.brand b { display: block; font-size: 19px; font-weight: 650; letter-spacing: -.055em; line-height: 1.25; white-space: nowrap; }
.brand small { display: block; margin-top: 6px; color: var(--ink-2); font-size: 8px; font-weight: 500; letter-spacing: .16em; line-height: 1.2; white-space: nowrap; }
#nav a { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; color: var(--ink-2); text-decoration: none; font-weight: 500; margin-bottom: 2px; }
#nav a:hover { background: var(--surface-2); }
#nav a.on { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: 0 0 0 1px var(--line); }
#nav a .k { margin-left: auto; font-size: 11px; color: var(--muted); }
.side-add { margin: 18px 4px 0; }
.side-foot { margin-top: auto; font-size: 11px; color: var(--muted); padding: 0 12px; }
main { padding: 26px 34px 110px; min-width: 0; }
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
.top .eyebrow { margin-bottom: 4px; }
.top h1 { font-size: 26px; margin: 0; font-weight: 800; }
.top-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.privacy-toggle { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 38px; font-size: 12px; }
.privacy-toggle svg, .asset-private-cover svg { width: 18px; height: 18px; flex: none; }
.privacy-toggle[aria-pressed="true"] { background: var(--surface-3); color: var(--ink); border-color: var(--axis); }
.privacy-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.asset-private { position: relative; }
.asset-private-cover { display: none; }
:root[data-assets-hidden="true"] .asset-private { min-height: 150px; }
:root[data-assets-hidden="true"] .asset-private-content { visibility: hidden; pointer-events: none; user-select: none; }
:root[data-assets-hidden="true"] .asset-private-cover { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 9px; padding: 20px; text-align: center; color: var(--ink-2); }
.asset-private-cover strong { color: var(--ink); font-size: 14px; font-weight: 600; }
.asset-private-cover small { font-size: 12px; }
:root[data-assets-hidden="true"] .asset-private-page > .asset-private-content { display: none; }
:root[data-assets-hidden="true"] .asset-private-page > .asset-private-cover { position: relative; min-height: 320px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
:root[data-assets-hidden="true"] .asset-record-count { display: none; }
.ym { display: flex; align-items: center; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
.ym-label { border: 0; background: none; font-weight: 700; font-size: 14px; padding: 4px 10px; min-width: 110px; }
.tabbar { display: none; }

/* 12-col grid */
.g { display: grid; grid-template-columns: repeat(12, minmax(0,1fr)); gap: 16px; }
.g > * { min-width: 0; }
.c2 { grid-column: span 2; } .c3 { grid-column: span 3; } .c4 { grid-column: span 4; } .c5 { grid-column: span 5; }
.c6 { grid-column: span 6; } .c7 { grid-column: span 7; } .c8 { grid-column: span 8; } .c9 { grid-column: span 9; } .c12 { grid-column: span 12; }
.sec-title { display: flex; align-items: baseline; gap: 10px; margin: 34px 0 12px; }
.sec-title h2 { font-size: 17px; margin: 0; font-weight: 800; }
.sec-title p { margin: 0; color: var(--muted); font-size: 12px; }
.sec-title::after { content: ""; flex: 1; height: 1px; background: var(--line); align-self: center; }

/* ── atoms ── */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; min-width: 0; }
.card.flat { background: transparent; }
.card-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 14px; }
.card-h h3 { margin: 0; font-size: 14px; font-weight: 700; }
.card-h .aside { font-size: 12px; color: var(--muted); }
.eyebrow { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .01em; }
.big { font-size: 34px; font-weight: 800; letter-spacing: -.035em; line-height: 1.1; }
.mid { font-size: 22px; font-weight: 800; letter-spacing: -.03em; line-height: 1.2; }
.unit { font-size: .55em; font-weight: 700; margin-left: 2px; color: var(--ink-2); }
.muted { color: var(--muted); } .sub { color: var(--ink-2); }
.small { font-size: 12px; } .xs { font-size: 11px; }
.row { display: flex; align-items: center; gap: 8px; }
.between { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.right { text-align: right; }
.mt { margin-top: 14px; } .mt2 { margin-top: 22px; }
.empty { padding: 28px 10px; text-align: center; color: var(--muted); font-size: 13px; }
.hr { height: 1px; background: var(--line); margin: 14px 0; }
.dot { width: 8px; height: 8px; border-radius: 3px; display: inline-block; flex: none; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--page); border-radius: 10px; padding: 9px 16px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.ghost { background: transparent; color: var(--ink-2); border-color: var(--line); font-weight: 600; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.accent { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.danger { background: transparent; color: var(--bad-ink); border-color: var(--line); }
.btn.sm { padding: 5px 10px; font-size: 12px; border-radius: 8px; }
.btn.block { width: 100%; }
.icon { border: 0; background: transparent; width: 30px; height: 30px; border-radius: 8px; cursor: pointer; font-size: 17px; color: var(--ink-2); }
.icon:hover { background: var(--surface-2); }

/* 상태칩: 항상 아이콘 + 라벨 */
.status { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 3px 9px 3px 7px; border-radius: 99px; background: var(--surface-2); }
.status i { font-style: normal; width: 14px; height: 14px; border-radius: 50%; display: grid; place-items: center; font-size: 9px; color: #fff; }
.status.good { color: var(--good-ink); } .status.good i { background: var(--good); }
.status.warn { color: var(--warn-ink); } .status.warn i { background: var(--warn); color: #3b2a00; }
.status.bad { color: var(--bad-ink); } .status.bad i { background: var(--bad); }
.delta-up { color: var(--bad-ink); font-weight: 700; } .delta-down { color: var(--good-ink); font-weight: 700; }
.delta-up.inv { color: var(--good-ink); } .delta-down.inv { color: var(--bad-ink); }
.tag { display: inline-block; padding: 1px 7px; border-radius: 6px; font-size: 11px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.tag.accent { background: var(--accent-soft); color: var(--accent-ink); }

/* bars */
.track { position: relative; height: 6px; background: var(--surface-3); border-radius: 99px; }
.track > b { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: var(--c, var(--ink)); }
.track .tick { position: absolute; top: -4px; bottom: -4px; width: 2px; border-radius: 2px; background: var(--ink); }
.track.over > b { background: var(--bad); }
/* 목표 없는 분류: 달성률로 안 읽히게 회색 + 점선 바탕 */
.track.ghost { background: repeating-linear-gradient(90deg, var(--surface-3) 0 6px, transparent 6px 9px); }
.track.ghost > b { background: var(--axis); opacity: .55; }
.track.ghost .tick { background: var(--ink-2); }
.stack { display: flex; height: 14px; gap: 2px; border-radius: 6px; overflow: hidden; }
.stack > span { min-width: 2px; }
.stack.tall { height: 22px; }

/* ── home hero ── */
.hero { padding: 24px 24px 14px; }
.hero-top { display: grid; grid-template-columns: minmax(0,1.3fr) minmax(0,1fr); gap: 24px; align-items: start; }
.hero .safe { border-left: 1px solid var(--line); padding-left: 24px; }
.hero .safe .big { color: var(--accent); }
.hero-kpis { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 0; }
.hero-kpis > div { display: grid; gap: 6px; align-content: start; padding: 0 22px; border-left: 1px solid var(--line); }
.hero-kpis > div:first-child { padding-left: 0; border-left: 0; }
.hero-kpis .safe { border-left: 1px solid var(--line); }
.hero-kpis .big { font-size: 30px; }
@media (max-width: 820px) {
  .hero-kpis { grid-template-columns: 1fr 1fr; gap: 16px 0; }
  .hero-kpis > div:nth-child(2) { padding-right: 0; }
  .hero-kpis > .safe { grid-column: 1 / -1; padding: 14px 0 0; border-left: 0; border-top: 1px solid var(--line); }
  .hero-kpis .big { font-size: 24px; }
}
/* 접는 영역 */
.fold { margin-top: 34px; }
.fold > summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); margin-bottom: 0; }
.fold > summary::-webkit-details-marker { display: none; }
.fold > summary span { display: grid; gap: 2px; }
.fold > summary small { color: var(--muted); font-size: 12px; }
.fold > summary .chev { font-style: normal; font-size: 20px; color: var(--muted); transition: transform .2s; }
.fold-body > .g { padding-top: 16px; }
.fold > summary { transition: border-color .2s, background .2s, box-shadow .2s; }
.fold[open] > summary { box-shadow: 0 6px 18px -10px rgba(16,32,72,.25); }
.fold[open] > summary .chev { transform: rotate(90deg); }
.fold > summary:hover { border-color: var(--axis); }
.chart { position: relative; height: 240px; }
.chart.sm { height: 180px; } .chart.lg { height: 300px; } .chart.xs { height: 120px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .ln { width: 14px; height: 2px; background: var(--ink); display: inline-block; }
.legend .ln.dash { background: repeating-linear-gradient(90deg, var(--muted) 0 4px, transparent 4px 7px); }

/* flow rows */
.flow-row { display: grid; grid-template-columns: 10px 1fr auto 46px; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.flow-row:last-child { border-bottom: 0; }
.flow-row .pc { color: var(--muted); font-size: 12px; text-align: right; }

/* category tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; cursor: pointer; transition: border-color .15s; }
.tile:hover { border-color: var(--axis); }
.tile .name { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; }
.tile .amt { font-size: 20px; font-weight: 800; letter-spacing: -.03em; margin: 8px 0 2px; }
.tile .goal { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.tile .foot { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 9px; }

/* calendar */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 5px; }
.cal .dow { text-align: center; font-size: 11px; color: var(--muted); font-weight: 600; padding-bottom: 2px; }
.cell { height: 62px; border-radius: 9px; padding: 6px 7px; background: var(--surface-2); cursor: pointer; display: flex; flex-direction: column; font-size: 11px; position: relative; outline: 2px solid transparent; outline-offset: -2px; transition: outline-color .1s; }
.cell:hover { outline-color: var(--axis); }
.cell.blank { background: transparent; cursor: default; outline: 0; }
.cell .d { font-weight: 700; font-size: 11px; }
.cell .v { margin-top: auto; text-align: right; font-weight: 700; font-size: 11px; }
.cell .inc { position: absolute; top: 6px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--c-save); }
.cell .zero { margin-top: auto; text-align: right; font-size: 10px; color: var(--good-ink); font-weight: 700; }
.cell.today { outline-color: var(--ink); }
.cell.sel { outline-color: var(--accent); }
.cell.future { opacity: .5; }
.cell.hot { color: #fff; } .cell.hot .zero { color: #fff; }
.scale { display: flex; align-items: center; gap: 3px; font-size: 11px; color: var(--muted); }
.scale i { width: 14px; height: 10px; border-radius: 3px; display: inline-block; }

/* lists */
.li { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--line); }
.li:last-child { border-bottom: 0; }
.li.click { cursor: pointer; border-radius: 10px; } .li.click:hover { background: var(--surface-2); }
.li .main { flex: 1; min-width: 0; }
.li .main b { display: block; font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .main small { color: var(--muted); font-size: 12px; }
.li .amt { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.li .badge-d { min-width: 44px; text-align: center; font-size: 11px; font-weight: 700; padding: 3px 0; border-radius: 7px; background: var(--surface-2); color: var(--ink-2); }
.li .badge-d.soon { background: var(--accent-soft); color: var(--accent-ink); }
.ic { width: 34px; height: 34px; border-radius: 10px; flex: none; display: grid; place-items: center; font-size: 12px; font-weight: 800; color: #fff; }
.insight { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.insight:last-child { border-bottom: 0; }
.insight .n { width: 20px; height: 20px; border-radius: 6px; background: var(--surface-2); font-size: 11px; font-weight: 800; display: grid; place-items: center; color: var(--ink-2); }

/* rank rows */
.rank { display: grid; grid-template-columns: 1fr 80px auto; gap: 10px; align-items: center; padding: 7px 0; font-size: 13px; }
.rank .track { height: 5px; }

/* day groups (tx) */
.tx-sum { padding: 8px 10px; border-radius: 10px; background: var(--surface-2); color: var(--ink-2); display: grid; gap: 3px; }
.tx-sum.on { box-shadow: inset 3px 0 0 var(--accent, #2a78d6); }
.tx-sum .between { flex-wrap: wrap; }
.day-h { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--ink-2); font-weight: 700; padding: 16px 4px 4px; position: sticky; top: 0; background: var(--surface); z-index: 1; }
.day-h .mini { flex: 1; height: 3px; background: var(--surface-3); border-radius: 3px; position: relative; }
.day-h .mini b { position: absolute; left: 0; top: 0; bottom: 0; background: var(--axis); border-radius: 3px; }

/* table */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 8px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { font-size: 11px; color: var(--muted); font-weight: 600; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
tr.total td { font-weight: 800; }
tr.sec td { font-weight: 700; color: var(--ink-2); font-size: 12px; padding-top: 16px; border-bottom-color: var(--axis); }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--surface-2); }
tr.dim td { opacity: .45; }
td.heat { position: relative; }

/* forms */
.field { margin-bottom: 14px; }
.field > label, .lbl { display: block; font-size: 12px; font-weight: 700; color: var(--ink-2); margin-bottom: 6px; }
.inp { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 12px; outline: 0; }
.inp:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.inp.amt { font-size: 28px; font-weight: 800; text-align: right; padding: 10px 14px; letter-spacing: -.03em; border-width: 0 0 2px; border-radius: 0; background: transparent; }
.inp.amt:focus { box-shadow: none; border-color: var(--accent); }
.inp.cell-in { text-align: right; padding: 6px 8px; font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; background: var(--surface-2); padding: 3px; border-radius: 10px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 13px; border-radius: 8px; cursor: pointer; font-weight: 600; color: var(--ink-2); font-size: 13px; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 12px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.chip:hover { border-color: var(--axis); }
.chip.on { background: var(--ink); border-color: var(--ink); color: var(--page); font-weight: 700; }
.quick { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; justify-content: flex-end; }
.quick button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 3px 9px; font-size: 12px; cursor: pointer; color: var(--ink-2); }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.toolbar .inp { width: auto; }
.sticky { position: sticky; top: 18px; }

/* stats strip */
.strip { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.strip > div { padding: 14px 16px; border-right: 1px solid var(--line); }
.strip > div:last-child { border-right: 0; }
.strip .mid { font-size: 19px; }

/* fixed timeline */
.tl { position: relative; height: 92px; margin: 8px 6px 4px; }
.tl .axis { position: absolute; left: 0; right: 0; top: 52px; height: 2px; background: var(--grid); border-radius: 2px; }
.tl .done { position: absolute; left: 0; top: 52px; height: 2px; background: var(--ink); border-radius: 2px; }
.tl .pt { position: absolute; top: 53px; transform: translate(-50%, -50%); border-radius: 50%; background: var(--c-fixed); box-shadow: 0 0 0 2px var(--surface); cursor: default; }
.tl .pt.inst { background: var(--c-var); }
.tl .pt.past { opacity: .35; }
.tl .lab { position: absolute; top: 0; transform: translateX(-50%); font-size: 10.5px; color: var(--ink-2); white-space: nowrap; text-align: center; line-height: 1.25; }
.tl .day { position: absolute; top: 66px; transform: translateX(-50%); font-size: 10px; color: var(--muted); }
.tl .now { position: absolute; top: 40px; height: 26px; width: 2px; background: var(--accent); }
.spark { display: flex; align-items: flex-end; gap: 2px; height: 22px; width: 92px; }
.spark i { flex: 1; background: var(--axis); border-radius: 2px 2px 0 0; min-height: 1px; }
.spark i.cur { background: var(--ink); }

/* modal & toast */
.modal { position: fixed; inset: 0; background: rgba(11,11,11,.4); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
.modal[hidden] { display: none; }
.sheet { background: var(--surface); border-radius: 20px; width: 100%; max-width: 520px; max-height: 92vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.2); }
.sheet.wide { max-width: 760px; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px 6px; }
.sheet-head h3 { margin: 0; font-size: 17px; }
.sheet-body { padding: 8px 22px 22px; overflow-y: auto; }
.form-foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
.toast { position: fixed; bottom: 92px; left: 50%; transform: translateX(-50%) translateY(16px); background: var(--ink); color: var(--page); padding: 10px 18px; border-radius: 12px; opacity: 0; transition: .25s; pointer-events: none; z-index: 60; font-weight: 600; font-size: 13px; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.loading { padding: 90px; text-align: center; color: var(--muted); }
.spin { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--grid); border-top-color: var(--ink); border-radius: 50%; animation: sp .8s linear infinite; vertical-align: -3px; margin-right: 8px; }
@keyframes sp { to { transform: rotate(360deg); } }
details > summary { cursor: pointer; list-style: none; }
details > summary::-webkit-details-marker { display: none; }

/* ── responsive ── */
@media (max-width: 1180px) {
  .c3 { grid-column: span 6; } .c4, .c5 { grid-column: span 6; } .c7, .c8 { grid-column: span 12; } .c9 { grid-column: span 12; }
  .c6.keep { grid-column: span 6; }
}
@media (max-width: 1180px) and (min-width: 821px) {
  .c4.full-md, .c5.full-md { grid-column: span 12; }
}
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; }
  .side { display: none; }
  main { padding: 18px 16px 120px; }
  .top { margin-bottom: 16px; }
  .top h1 { font-size: 21px; }
  .top-actions { display: contents; }
  .top .privacy-toggle { margin-left: auto; }
  .top .ym { flex-basis: 100%; justify-content: center; }
  .g { gap: 12px; }
  .c2, .c3, .c4, .c5, .c6, .c6.keep, .c7, .c8, .c9 { grid-column: span 12; }
  .card { padding: 16px; }
  .big { font-size: 28px; }
  .hero { padding: 18px 16px 10px; }
  .hero-top { grid-template-columns: 1fr; gap: 14px; }
  .hero .safe { border-left: 0; border-top: 1px solid var(--line); padding: 14px 0 0; }
  .strip { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .strip > div:nth-child(2) { border-right: 0; }
  .strip > div:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
  .tiles { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .tile .amt { font-size: 17px; }
  .cell { height: auto; aspect-ratio: 1 / 1; padding: 4px 5px; }
  .cell .v { font-size: 10px; }
  .hide-m { display: none !important; }
  .chart { height: 210px; } .chart.lg { height: 240px; }
  .tabbar { display: flex; position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--line); z-index: 45; padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); align-items: center; }
  .tabbar a { flex: 1; text-align: center; padding: 4px 0; font-size: 11px; color: var(--muted); text-decoration: none; font-weight: 600; }
  .tabbar a i { display: block; font-style: normal; font-size: 17px; line-height: 1.3; }
  .tabbar a.on { color: var(--ink); }
  .tabbar .add { flex: none; width: 52px; height: 52px; margin: -22px 8px 0; border-radius: 18px; border: 0; background: var(--ink); color: var(--page); font-size: 26px; box-shadow: 0 8px 20px rgba(0,0,0,.25); cursor: pointer; }
  .modal { align-items: flex-end; padding: 0; }
  .sheet, .sheet.wide { border-radius: 20px 20px 0 0; max-height: 94vh; }
  .tl .lab { display: none; }
}
@media (min-width: 821px) { .show-m { display: none !important; } }

/* 홈 상단 자산 요약 */
.home-assets { margin-bottom: 0; }
.home-assets > .card-h { flex-wrap: wrap; gap: 12px; }
.home-asset-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 20px; padding: 7px 0 18px; }
.home-asset-metric { min-width: 0; padding-right: 18px; }
.home-asset-metric + .home-asset-metric { border-left: 1px solid var(--line); padding-left: 20px; }
.home-asset-metric .big, .home-asset-metric .mid { margin-top: 10px; overflow-wrap: anywhere; }
.home-asset-meta { display: flex; flex-wrap: wrap; gap: 8px 22px; border-top: 1px solid var(--line); padding-top: 14px; font-size: 12px; color: var(--ink-2); }
.home-asset-meta b { color: var(--ink); font-weight: 600; margin-left: 4px; }
@media (max-width: 820px) {
  .home-asset-grid { grid-template-columns: 1fr; gap: 16px; }
  .home-asset-metric:first-child { padding-bottom: 16px; border-bottom: 1px solid var(--line); }
  .home-asset-metric:nth-child(2) { padding-left: 0; border-left: 0; }
  .home-asset-metric + .home-asset-metric { padding-left: 0; border-left: 0; }
  .home-asset-metric .mid { font-size: 19px; }
}

.asset-manager-group { margin-top: 22px; }
.asset-manager-list { margin-top: 8px; }
.asset-manager-item { display: flex; align-items: center; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.asset-manager-item:last-child { border-bottom: 0; }
.asset-manager-item > strong { font-size: 17px; white-space: nowrap; }
.asset-zero { color: var(--muted); }
.asset-manager .asset-dormant { border-top: 1px solid var(--line); margin-top: 18px; padding-top: 16px; }
.saving-plan-table [data-saving-name] { min-width: 150px; }
.saving-plan-table [data-saving-target], .saving-plan-table [data-saving-actual] { min-width: 100px; width: 130px; text-align: right; margin-left: auto; }
.asset-history > summary { cursor: pointer; }
@media (max-width: 600px) {
 .asset-manager-item { flex-wrap: wrap; gap: 8px 12px; }
 .asset-manager-item > .grow { flex-basis: 100%; }
 .asset-manager-item > .btn { margin-left: auto; }
}

/* ═════ 움직임 (점포개발 워크스페이스와 같은 톤: 짧게 0.14~0.25초, 작게 4~8px, 필요한 속성만 transition) ═════ */
@keyframes ws-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
@keyframes ws-soft { from { opacity: .35; } to { opacity: 1; } }
@keyframes ws-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes ws-fade-out { from { opacity: 1; } to { opacity: 0; } }
@keyframes ws-pop { from { opacity: 0; transform: translateY(6px) scale(.985); } to { opacity: 1; transform: none; } }
@keyframes ws-pop-out { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(4px) scale(.985); } }
@keyframes ws-up { from { opacity: .4; transform: translateY(28px); } to { opacity: 1; transform: none; } }
@keyframes ws-down { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(28px); } }
@keyframes ws-sh { 0% { left: -65%; } 38%, 100% { left: 125%; } }
/* 페이지 이동: 위에서 살짝 내려오며 (아래에서 올라오면 스크롤바가 번쩍임) */
#view.ws-enter { animation: ws-in .22s ease-out; }
/* 바뀐 영역만: 완전 투명이 아니라 살짝 흐린 데서 선명해지기만 (흰 번쩍임 방지) */
.ws-fx { animation: ws-soft .24s ease-out; }
/* 팝업: 배경은 페이드, 창은 떠오르며 열리고 반대로 닫힘. 휴대폰 바텀시트는 아래에서 올라옴 */
.modal:not([hidden]) { animation: ws-fade .16s ease-out; }
.modal:not([hidden]) .sheet { animation: ws-pop .2s ease-out; }
.modal.out { animation: ws-fade-out .14s ease-in forwards; pointer-events: none; }
.modal.out .sheet { animation: ws-pop-out .14s ease-in forwards; }
@media (max-width: 820px) {
  .modal:not([hidden]) .sheet { animation: ws-up .24s cubic-bezier(.2,.8,.2,1); }
  .modal.out .sheet { animation: ws-down .16s ease-in forwards; }
}
/* 버튼·카드: 은은한 hover, 누르면 1px 눌림 */
.btn, .chip, .seg button, .icon, #nav a, .tabbar a, .quick button { transition: background-color .15s, border-color .15s, color .15s, box-shadow .15s, transform .08s; }
.btn:active:not(:disabled), .chip:active, .seg button:active, .quick button:active, .tile:active, .li.click:active, .cell:active:not(.blank) { transform: translateY(1px); }
.card, .tile, .li.click, tr.click td { transition: background-color .15s, border-color .15s, box-shadow .15s; }
.tile:hover, .card.hov:hover { box-shadow: 0 2px 10px rgba(16,32,72,.06); }
.toast { transition: opacity .25s, transform .25s; }
/* ＋ 거래 추가 버튼: 2.6초마다 빛이 한 번 지나감 */
#sideAdd, .tabbar .add { position: relative; overflow: hidden; }
#sideAdd::after, .tabbar .add::after { content: ""; position: absolute; top: 0; bottom: 0; left: -65%; width: 45%; pointer-events: none;
  background: linear-gradient(100deg, transparent, rgba(255,255,255,.28), transparent); transform: skewX(-18deg); animation: ws-sh 2.6s ease-in-out 1s infinite; }

/* 앱 안 확인창 */
.ws-dlg { position: fixed; inset: 0; z-index: 120; background: rgba(11,11,11,.4); display: flex; align-items: center; justify-content: center; padding: 16px; animation: ws-fade .16s ease-out; }
.ws-dlg-b { background: var(--surface); border-radius: 16px; width: min(400px, 100%); padding: 22px 22px 18px; box-shadow: 0 20px 60px rgba(0,0,0,.22); animation: ws-pop .2s ease-out; }
.ws-dlg-b h3 { margin: 0 0 8px; font-size: 16px; }
.ws-dlg-b p { margin: 0; color: var(--ink-2); font-size: 14px; line-height: 1.6; }
.ws-dlg-a { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 20px; }
.btn.warn { background: var(--bad); border-color: var(--bad); color: #fff; }
.ws-dlg.out { animation: ws-fade-out .14s ease-in forwards; pointer-events: none; }
.ws-dlg.out .ws-dlg-b { animation: ws-pop-out .14s ease-in forwards; }

/* 저장 중 표시 */
#wsBusy { position: fixed; inset: 0; z-index: 200; background: color-mix(in srgb, var(--page) 55%, transparent); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); display: none; align-items: center; justify-content: center; }
#wsBusy.on { display: flex; animation: ws-fade .16s ease-out; }
#wsBusy > div { background: var(--surface); border-radius: 12px; box-shadow: 0 12px 36px rgba(16,32,72,.2); padding: 18px 26px; display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 700; }
#wsBusy .spin { margin: 0; }

/* 말풍선 설명 */
[data-tip] { cursor: help; }
@keyframes ws-tip-in { from { opacity: 0; transform: translateY(5px) scale(.96); filter: blur(2px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes ws-tip-in-b { from { opacity: 0; transform: translateY(-5px) scale(.96); filter: blur(2px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes ws-tip-in-r { from { opacity: 0; transform: translateX(-6px) scale(.96); filter: blur(2px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes ws-tip-out { to { opacity: 0; transform: scale(.97); } }
.ws-tip { position: fixed; z-index: 150; max-width: 280px; padding: 9px 13px; border-radius: 11px;
  background: var(--ink); color: var(--page); font-size: 12px; font-weight: 500; line-height: 1.55; letter-spacing: -.01em;
  pointer-events: none; white-space: pre-line;
  box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 10px 28px -6px rgba(16,32,72,.32);
  transform-origin: var(--ax, 50%) 100%; animation: ws-tip-in .22s cubic-bezier(.2,.9,.3,1.15) both; }
/* 꼬리: 말풍선 몸통에 붙은 작은 삼각형 */
.ws-tip::after { content: ''; position: absolute; width: 12px; height: 7px; background: inherit; left: var(--ax, 50%); top: 100%; margin-left: -6px; clip-path: polygon(0 0, 100% 0, 50% 100%); }
.ws-tip[data-pos="below"] { transform-origin: var(--ax, 50%) 0; animation-name: ws-tip-in-b; }
.ws-tip[data-pos="below"]::after { top: auto; bottom: 100%; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.ws-tip[data-pos="right"] { transform-origin: 0 var(--ay, 50%); animation-name: ws-tip-in-r; }
.ws-tip[data-pos="right"]::after { width: 7px; height: 12px; left: auto; right: 100%; top: var(--ay, 50%); margin: -6px 0 0; clip-path: polygon(100% 0, 100% 100%, 0 50%); }
.ws-tip.out { animation: ws-tip-out .14s ease-in forwards; }
.tip-i { display: inline-grid; place-items: center; width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--axis); color: var(--muted); font-size: 9px; font-weight: 800; font-style: normal; margin-left: 4px; vertical-align: 1px; transition: background .15s, color .15s, border-color .15s; }
[data-tip]:hover .tip-i { background: var(--ink); border-color: var(--ink); color: var(--page); }
@media (hover: none) { .tip-i { width: 18px; height: 18px; font-size: 10px; } }

/* 접는 영역·차례로 떠오르기·달력 날짜 선택 */
@keyframes ws-stag { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.ws-stag { animation: ws-stag .65s cubic-bezier(.22,.8,.24,1) both; }
@keyframes ws-pick { 0% { transform: scale(1); } 35% { transform: scale(.9); } 100% { transform: scale(1); } }
.cell.ws-pick { animation: ws-pick .55s cubic-bezier(.3,1.35,.5,1); }
.cell { transition: outline-color .35s, box-shadow .35s; }
.cell.sel { box-shadow: 0 4px 14px -4px color-mix(in srgb, var(--accent) 55%, transparent); }
.brand { cursor: pointer; border-radius: 12px; transition: opacity .15s; }
.brand:hover { opacity: .78; }
.brand:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 불러오는 동안 카드 자리 */
@keyframes ws-shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
.skel .card { overflow: hidden; }
.sk { display: block; height: 11px; margin: 9px 0; border-radius: 6px; width: 100%;
  background: linear-gradient(90deg, var(--surface-2) 0%, var(--surface-3) 45%, var(--surface-2) 90%); background-size: 200% 100%; animation: ws-shimmer 1.6s ease-in-out infinite; }
.sk.big { height: 28px; margin: 12px 0; } .sk.chart { height: 170px; margin-top: 22px; border-radius: 12px; }
.sk.w30 { width: 30%; } .sk.w40 { width: 40%; } .sk.w50 { width: 50%; } .sk.w60 { width: 60%; } .sk.w70 { width: 70%; } .sk.w80 { width: 80%; }
.skel-kpis { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 28px; }
@media (max-width: 820px) { .skel-kpis { grid-template-columns: 1fr 1fr; } .skel-kpis > :last-child { display: none; } }

/* 월 넘김 방향 */
@keyframes ws-from-r { from { opacity: .2; transform: translateX(26px); } to { opacity: 1; transform: none; } }
@keyframes ws-from-l { from { opacity: .2; transform: translateX(-26px); } to { opacity: 1; transform: none; } }
#view.ws-from-r { animation: ws-from-r .5s cubic-bezier(.22,.8,.24,1); }
#view.ws-from-l { animation: ws-from-l .5s cubic-bezier(.22,.8,.24,1); }

/* 방금 저장한 거래: 형광펜이 한 번 지나감 */
@keyframes ws-marker { 0% { background-size: 0% 100%; opacity: 1; } 35% { background-size: 100% 100%; opacity: 1; } 80% { opacity: 1; } 100% { background-size: 100% 100%; opacity: 0; } }
.li.flash { position: relative; isolation: isolate; }
.li.flash::before { content: ''; position: absolute; inset: 3px -2px; border-radius: 8px; pointer-events: none; z-index: -1;
  background: linear-gradient(transparent 0, rgba(250,178,25,.30) 0) no-repeat left / 0% 100%; animation: ws-marker 2.2s cubic-bezier(.3,.7,.2,1) .15s forwards; }
.li.flash .main, .li.flash .amt, .li.flash .ic { position: relative; }

/* 휴대폰 바텀시트 손잡이 · 끌어내려 닫기 */
@media (max-width: 820px) {
  .sheet-head { position: relative; padding-top: 22px; touch-action: none; }
  .sheet-head::before { content: ''; position: absolute; top: 8px; left: 50%; width: 38px; height: 4px; margin-left: -19px; border-radius: 4px; background: var(--axis); opacity: .7; }
  .modal.out.dragged .sheet { animation: none; }
}

/* 단축키 안내 버튼 */

    document.addEventListener('mouseout', e => { if (cur && !cur.contains(e.relatedTarget)) hide(); });

  } else {

/* ── 접는 영역(<details class="fold">): 높이가 부드럽게 늘고 줄며, 펼칠 때 안의 카드가 차례로 떠오름 ── */
function initFolds() {
  document.addEventListener('click', e => {
    const sm = e.target.closest && e.target.closest('details.fold > summary');
    if (!sm) return;
    const d = sm.parentElement, body = d.querySelector('.fold-body');
    if (!body || reducedMotion() || !body.animate) return;   // 움직임 없이 기본 동작
    e.preventDefault();
    if (d._anim) d._anim.cancel();
    body.style.overflow = 'hidden';
    const done = () => { body.style.overflow = ''; body.style.height = ''; d._anim = null; };
    if (!d.open) {
      d.open = true;
      const h = body.scrollHeight;
      d._anim = body.animate([{ height: '0px', opacity: 0 }, { height: h + 'px', opacity: 1 }], { duration: 750, easing: 'cubic-bezier(.22,.8,.24,1)' });
      d._anim.onfinish = done;
      stagger(body.querySelectorAll(':scope > .g > .card'), 110);
    } else {
      const h = body.offsetHeight;
      d._anim = body.animate([{ height: h + 'px', opacity: 1 }, { height: '0px', opacity: 0 }], { duration: 480, easing: 'cubic-bezier(.4,0,.5,1)' });
      d._anim.onfinish = () => { d.open = false; done(); };

/* 목록·카드를 차례로 살짝 떠오르게 (step ms 간격) */
function stagger(els, step) {
  if (reducedMotion()) return;
  [...els].forEach((el, i) => {
    el.classList.remove('ws-stag'); void el.offsetWidth;
    el.style.animationDelay = Math.min(i, 10) * (step || 40) + 'ms';
    el.classList.add('ws-stag');
    clearTimeout(el._stT); el._stT = setTimeout(() => { el.classList.remove('ws-stag'); el.style.animationDelay = ''; }, 2000);
  });
}

/* ── 월 넘김: 방향이 있는 전환 + 큰 금액이 이전 값에서 굴러가듯 바뀜 ── */
const ROLL_SEL = '#view .big, #view .mid';
function firstNum(el) {
  const tw = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  for (let n; (n = tw.nextNode());) {
    const m = n.nodeValue.match(/^(\s*[−-]?)([\d,]*\d)([\s\S]*)$/);
    if (m) return { node: n, pre: m[1], v: +m[2].replace(/,/g, ''), post: m[3] };
  }
  return null;
}
const numSnap = () => $$(ROLL_SEL).map(el => { const n = firstNum(el); return n ? n.v : null; });
function rollNumbers(old) {
  if (!old || reducedMotion()) return;
  $$(ROLL_SEL).forEach((el, i) => {
    const o = old[i], n = firstNum(el);
    if (o == null || !n || o === n.v) return;
    n.node.nodeValue = n.pre + o.toLocaleString('ko-KR') + n.post;   // 첫 프레임부터 이전 값에서 출발
    const t0 = performance.now(), dur = 750;
    const step = t => {
      if (!n.node.isConnected) return;
      const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      n.node.nodeValue = n.pre + Math.round(o + (n.v - o) * e).toLocaleString('ko-KR') + n.post;
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}
const slideFx = dir => restartCls($('#view'), dir > 0 ? 'ws-from-r' : 'ws-from-l', 600);

/* ── 짧은 진동(안드로이드 휴대폰만, 지원 안 하면 조용히 무시) ── */
const haptic = ms => { try { if (navigator.vibrate && matchMedia('(hover: none)').matches) navigator.vibrate(ms || 10); } catch (e) {} };

/* ── 휴대폰 손동작: 본문을 좌우로 밀면 달 이동 / 입력창은 위 손잡이를 끌어내려 닫기 ── */
function initGestures() {
  let sx = 0, sy = 0, st = 0, ok = false;
  const NO = 'input,textarea,select,canvas,.tbl-wrap,.chips,.seg,.cal,.modal,[data-noswipe]';
  document.addEventListener('touchstart', e => {
    const t = e.touches[0]; ok = e.touches.length === 1 && !!e.target.closest('#view') && !e.target.closest(NO);
    sx = t.clientX; sy = t.clientY; st = Date.now();
  }, { passive: true });
  document.addEventListener('touchend', e => {
    if (!ok || ['set', 'more'].includes(S.view) || !$('#modal').hidden) return;
    const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 70 && Math.abs(dy) < 45 && Date.now() - st < 650) { haptic(8); shiftMonth(dx < 0 ? 1 : -1); }
  }, { passive: true });

  // 바텀시트 끌어내리기
  const md = $('#modal'), sheet = md.querySelector('.sheet');
  let y0 = 0, dy = 0, drag = false, tStart = 0;
  sheet.addEventListener('touchstart', e => {
    const body = $('#modalBody');
    drag = !!e.target.closest('.sheet-head') || (body.scrollTop <= 0 && !e.target.closest('input,textarea,select,.chips'));
    if (!drag || !matchMedia('(max-width: 820px)').matches) { drag = false; return; }
    y0 = e.touches[0].clientY; dy = 0; tStart = Date.now();
  }, { passive: true });
  sheet.addEventListener('touchmove', e => {
    if (!drag) return;
    dy = Math.max(0, e.touches[0].clientY - y0);
    if (dy > 4) { sheet.style.transition = 'none'; sheet.style.transform = `translateY(${dy}px)`; md.style.background = `rgba(11,11,11,${Math.max(.08, .4 - dy / 900)})`; }
  }, { passive: true });
  sheet.addEventListener('touchend', () => {
    if (!drag) return; drag = false;
    const fast = dy > 40 && dy / Math.max(1, Date.now() - tStart) > .6;
    sheet.style.transition = 'transform .28s cubic-bezier(.2,.8,.2,1)'; md.style.background = '';
    if (dy > 120 || fast) {
      md.classList.add('dragged'); sheet.style.transform = 'translateY(105%)'; haptic(6);

    } else sheet.style.transform = '';

}
function resetSheetDrag() {

}

/* ── 금액 입력칸(input.money): 쓰는 동안 천 단위 쉼표.
      값은 화면 표시용이고, 저장할 때는 moneyOf()/num()으로 쉼표를 뺀 숫자를 씀. 빈칸('')과 0은 구분 ── */
const moneyOf = el => { const v = String(el.value || '').replace(/[,\s]/g, ''); return v === '' || v === '-' ? '' : Number(v); };
function fmtMoneyStr(v, neg) {
  v = String(v == null ? '' : v);
  const minus = neg && /^\s*-/.test(v), d = v.replace(/[^\d]/g, '').replace(/^0+(?=\d)/, '');
  return (minus ? '-' : '') + (d ? Number(d).toLocaleString('ko-KR') : '');
}
function initMoneyIn(root) {
  $$('input.money', root || document).forEach(el => {
    el.setAttribute('inputmode', el.dataset.neg ? 'text' : 'numeric'); el.autocomplete = 'off';
    el.value = fmtMoneyStr(el.value, el.dataset.neg);
  });
}
document.addEventListener('input', e => {
  const el = e.target;
  if (!el.matches || !el.matches('input.money')) return;
  const pos = el.selectionStart || 0, digitsBefore = el.value.slice(0, pos).replace(/[^\d]/g, '').length;
  el.value = fmtMoneyStr(el.value, el.dataset.neg);
  let i = 0, seen = 0; while (i < el.value.length && seen < digitsBefore) { if (/\d/.test(el.value[i])) seen++; i++; }
  try { el.setSelectionRange(i, i); } catch (er) {}
}, true);

/* ── 넓은 표: 첫 열·머리글 고정, 옆으로 더 있으면 가장자리 그림자와 안내 ── */
function initTables(root) {
  $$('.tbl-wrap.sticky', root || document).forEach(w => {
    let hint = w.nextElementSibling;
    if (!hint || !hint.classList.contains('tbl-hint')) { hint = document.createElement('div'); hint.className = 'tbl-hint'; hint.textContent = '← 옆으로 밀어서 다른 달 보기 →'; w.after(hint); }
    const upd = () => {
      const can = w.scrollWidth > w.clientWidth + 4;
      w.classList.toggle('can-scroll', can); hint.classList.toggle('on', can);
      w.classList.toggle('at-start', w.scrollLeft <= 2);

    };
    if (!w._tbl) { w._tbl = true; w.addEventListener('scroll', upd, { passive: true }); window.addEventListener('resize', upd); }
    upd();

}

  <script>
let stockRefreshTimer;
function stockKey(row) { return JSON.stringify([row.대분류,row.중분류,row.항목]); }
function stockUsd(v) { return v == null ? '조회 대기' : '$' + Number(v).toLocaleString('en-US',{maximumFractionDigits:2}); }
function isStockLinkCandidate(r) {
  return isAsset(r) && r.대분류==='유동자산' && !/청약|보증금|부동산/.test(r.항목) &&
    (r.중분류==='투자' || /주식|증권|예수금|CMA/i.test(r.항목));
}
function stockSummary(p, snapshot) {
  const c=p.config||{}, hs=p.holdings||[], rows=snapshot?snapshot.rows:[];
  const rawLinks=c.links||[];
  const links=rawLinks.filter(key=>{try {const x=JSON.parse(key);return isStockLinkCandidate({대분류:x[0],중분류:x[1],항목:x[2]});}catch(e){return false;}});
  const mode=c.mode||(links.length?'replace':'');
  const missing=links.some(key=>!rows.some(r=>stockKey(r)===key));
  const linked=rows.filter(r=>links.includes(stockKey(r))).reduce((s,r)=>s+num(r.금액),0);
  const ready=(mode==='replace'&&links.length>0&&!missing)||(mode==='new'&&!rawLinks.length);
  const other=snapshot&&ready?assetTotals(rows).net-linked:null;
  const quotesOK=hs.every(h=>Number.isFinite(h.price)&&h.price>0&&h.currency==='USD');
  const cashUsd=Number(c.cashUsd)||0,cashKrw=Number(c.cashKrw)||0;
  const marketUsd=quotesOK?hs.reduce((v,h)=>v+h.quantity*h.price,0):null;
  const valuation=quotesOK&&p.fx>0?(marketUsd+cashUsd)*p.fx+cashKrw:null;
  const deposit=c.depositKrw==null||c.depositKrw===''?null:Number(c.depositKrw);
  return {valuation,deposit,marketUsd,other,missing,linked,mode,links,
    totalValuation:other!=null&&valuation!=null?other+valuation:null,
    totalDeposit:other!=null&&deposit!=null?other+deposit:null};
}
/** 지금 내 자산 — 오늘 기준. 자산 항목은 각자 마지막으로 입력한 잔액, 주식계좌는 최신 시세.
    항목마다 총자산에 어떻게 들어가는지(포함·차감·대체됨·합계 제외)와 입력 시점·오래됨을 붙임 */
function assetNow(p, snap, today) {
  p=p||{holdings:[],config:{}};

  const replaced=a.mode==='replace'?a.links:[];

    const role=replaced.includes(stockKey(r))?'replaced':r.대분류==='참고'?'excluded':r.대분류==='부채'?'debt':'included';
    return {row:r,role,age,stale:(role==='included'||role==='debt')&&num(r.금액)!==0&&age>=2,label:`${r.연도}년 ${+r.월?r.월+'월':'기초'}`};
  });
  const warnings=[];
  if(p.configured&&a.mode==='new'&&rows.some(x=>x.role==='included'&&isStockLinkCandidate(x.row)))
    warnings.push('‘새 계좌 추가’로 설정했는데 기존 자산에 주식계좌로 보이는 항목이 있어요. 같은 계좌라면 ‘기존 자산 대체’로 바꿔야 두 번 더해지지 않아요.');
  if(p.configured&&(Number(p.config&&p.config.cashKrw)||Number(p.config&&p.config.cashUsd))&&rows.some(x=>x.role==='included'&&/예수금/.test(x.row.항목)))

  <script>
/* ═════════════ 미분류 검토함 · 분류 규칙 · 중복 의심 ═════════════
   데이터 판단(어떤 거래가 미분류·자동 제안·중복 의심인지)은 위쪽 순수 함수, 화면은 아래쪽. */

const isAutoTx = t => /^hana_/.test(String(t.ID || ''));
const isUncat = t => t.구분 === '지출' && (!t.대분류 || t.대분류 === '미분류');
/** 카드 자동등록이 같은 가맹점의 이전 분류를 복사해 둔 것 — 아직 사용자가 확정하지 않음
    (분류상태 '규칙' = 사용자가 만든 가맹점 규칙으로 수신기가 붙인 것 → 확정으로 봄) */
const isSuggested = t => t.구분 === '지출' && isAutoTx(t) && !['확정', '규칙'].includes(t.분류상태) && !isUncat(t);
const normName = s => String(s || '').replace(/\s+/g, ' ').trim();
/** 가맹점 이름 — 카드 자동등록은 내용을 고쳐 써도(예: '피자 엄마 사줌') 카드 알림의 원래 가맹점으로 묶음.
    그래야 규칙이 다음 카드 알림의 가맹점과 맞음. 수신 기록에 없으면 내용으로 */
const merchantOf = t => normName((isAutoTx(t) && S.cardStatus && S.cardStatus.merchants && S.cardStatus.merchants[t.ID]) || t.내용) || '(내용 없음)';
const rules = () => (D().분류규칙 || []);
const ruleFor = name => rules().find(r => r.가맹점 === name);
function jsonSetting(k, d) { try { const v = JSON.parse(setting(k) || ''); return v == null ? d : v; } catch (e) { return d; } }

/** 중복 의심: 같은 금액·±1일 지출 중 카드 자동등록이 끼어 있는 쌍 (같은 할부 묶음·'중복 아님'으로 표시한 쌍 제외) */
function duplicateSuspects(txs, dismissed) {
  const off = new Set(dismissed || []), byAmt = new Map(), out = [];
  const day = d => Date.UTC(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10)) / 864e5;
  txs.filter(t => t.구분 === '지출' && t.날짜 && num(t.금액) > 0).forEach(t => { const k = num(t.금액); if (!byAmt.has(k)) byAmt.set(k, []); byAmt.get(k).push(t); });
  byAmt.forEach(arr => {
    for (let i = 0; i < arr.length; i++) for (let j = i + 1; j < arr.length; j++) {
      const a = arr[i], b = arr[j];
      if (!(isAutoTx(a) || isAutoTx(b)) || (a.할부ID && a.할부ID === b.할부ID) || Math.abs(day(a.날짜) - day(b.날짜)) > 1) continue;
      const key = [a.ID, b.ID].sort().join('|');
      if (!off.has(key)) out.push({ key, a, b });
    }
  });
  return out.sort((x, y) => (y.a.날짜 > x.a.날짜 ? 1 : -1));
}
function reviewQueue() {
  const tx = D().거래내역;
  return { unc: tx.filter(isUncat), sug: tx.filter(isSuggested), dup: duplicateSuspects(tx, jsonSetting('중복아님', [])), rules: rules() };
}
/** 서버 결과를 화면 데이터에 반영 (다시 불러오지 않고) */
function applyClassified(ids, big, small) {
  const s = new Set(ids);
  D().거래내역.forEach(t => { if (s.has(t.ID)) { if (big) { t.대분류 = big; t.소분류 = small; } t.분류상태 = '확정'; } });
}

/* ── 화면 ── */
function vReview() {

    summary: dup.length || iss.length ? [iss.length && `수신 확인 ${iss.length}건`, dup.length && `중복 의심 ${dup.length}쌍`].filter(Boolean).join(' · ') : '없어요',
    detail: S.cardStatus ? '해석 실패 기록은 11월 1일 수신기 업데이트 뒤부터 쌓여요' : '카드 수신 기록을 확인하고 있어요' });
  // 3) 고정지출: 예상액으로 채운 항목 / 기록 없는 항목 (안 냈으면 0원으로 적으면 깔끔)

    detail: cur && proj.length ? `이번 달이라 아직 직전 달 금액으로 예상해 보여 줘요. 실제로 빠져나간 금액이 다르면 그때 고쳐 주세요` : proj.length ? `예상액(직전 달 금액)은 실제로 확정된 값이 아니에요: ${proj.slice(0, 4).map(f => f.항목).join(', ')}${proj.length > 4 ? ' 외' : ''}` : blank.length ? `그 달에 안 냈으면 0원으로 적어 두면 돼요: ${blank.slice(0, 4).map(f => f.항목).join(', ')}` : '' });

/* 자산 — '참고'(투자원금)는 합계 제외, 수익률 계산용 */
const ASSET_GROUPS = ['부동자산', '유동자산', '부채', '참고'];
const isAsset = r => r.대분류 !== '부채' && r.대분류 !== '참고';
const assetRows = (y, m) => D().자산.filter(r => +r.연도 === y && +r.월 === m);
function assetTotals(rows) {
  const asset = sum(rows.filter(isAsset), r => r.금액);
  const debt = sum(rows.filter(r => r.대분류 === '부채'), r => r.금액);
  const principal = sum(rows.filter(r => r.대분류 === '참고' && r.중분류 === '투자원금'), r => r.금액);
  const invest = sum(rows.filter(r => isAsset(r) && r.중분류 === '투자'), r => r.금액);
  return { asset, debt, net: asset - debt, principal, invest };
}
function assetBalanceRows(y,m) {
  const cutoff=Number(y)*13+Number(m), latest=new Map();
  D().자산.forEach(r=>{
    const time=Number(r.연도)*13+Number(r.월);
    if(time>cutoff||r.금액===''||r.금액==null)return;
    const key=JSON.stringify([r.대분류,r.중분류,r.항목]),old=latest.get(key);
    if(!old||time>=old.time)latest.set(key,{time,row:r});
  });
  return [...latest.values()].map(v=>v.row);
}
function latestAsset(y,m) {
  const rows=assetBalanceRows(y,m);
  if(!rows.length)return null;
  const last=Math.max(...rows.map(r=>Number(r.연도)*13+Number(r.월)));
  return {y:Math.floor(last/13),m:last%13,rows,asOfY:y,asOfM:m};
}
function assetItems(y) {
  const seen = new Map();
  D().자산.filter(r => +r.연도 <= y).concat(S.extraAssets)
    .forEach(r => { const k = r.대분류 + '|' + r.중분류 + '|' + r.항목; if (!seen.has(k)) seen.set(k, { 대분류: r.대분류, 중분류: r.중분류, 항목: r.항목 }); });
  return [...seen.values()].sort((a, b) => ASSET_GROUPS.indexOf(a.대분류) - ASSET_GROUPS.indexOf(b.대분류));
}
const assetMonths = y => [...Array(13)].map((_, i) => i).filter(i => assetRows(y, i).length);

/* 복지포인트 */
function points(y, m) {
  return refVals('포인트구분').map(k => {
    let total = 0, cum = 0;
    for (let mm = 1; mm <= m; mm++) {
      const row = D().포인트.find(r => +r.연도 === y && +r.월 === mm && r.구분 === k);
      if (row && num(row.부여총액)) total = num(row.부여총액);
      cum += sum(txIn(y, mm).filter(t => t.포인트구분 === k), t => t.금액) + num(row ? row.조정 : 0);
    }
    const row = D().포인트.find(r => +r.연도 === y && +r.월 === m && r.구분 === k) || {};
    return { k, total, cum, left: total - cum, used: sum(txIn(y, m).filter(t => t.포인트구분 === k), t => t.금액), adj: num(row.조정) };
  });
}

function deltaTxt(cur, base, inv, unitPct) {

  return `<span class="${cls}">${d > 0 ? '▲' : '▼'} ${unitPct ? Math.abs(r * 100).toFixed(0) + '%' : man(Math.abs(d))}</span>`;

  const remain = isCur ? c.days - td + 1 : isPast ? 0 : c.days;
  const left = c.budget - c.variable;
  const pace = c.elapsed / c.days;
  const ratio = c.budget ? c.variable / c.budget : 0;
  let st;
  if (!c.budget) st = status('warn', '예산 미설정');

  else st = status('good', isPast ? '예산 내 마감' : '여유 있음');

/* 목표 없는 분류: 달성률처럼 보이지 않게, 3개월 평균 자리에 눈금만 둔 회색 막대 */
function avgBar(cur, avg) {
  if (!avg) return '<div class="track ghost"></div>';
  const mx = Math.max(cur, avg);
  return `<div class="track ghost" title="회색 막대 = 이번 달, 눈금 = 3개월 평균"><b style="width:${cur / mx * 100}%"></b><i class="tick" style="left:calc(${avg / mx * 100}% - 1px)"></i></div>`;
}
function topMerchantsHtml(c) {
  const cur = sortedEntries(groupSum(c.ex, t => String(t.내용 || '').trim() || '(내용 없음)')).slice(0, 6);
  if (!cur.length) return '<div class="empty">이번 달 지출이 없어요</div>';
  const max = cur[0][1], cnt = k => c.ex.filter(t => (String(t.내용 || '').trim() || '(내용 없음)') === k).length;
  return cur.map(([k, v]) => `<div class="rank"><span class="ellipsis">${esc(k)} <span class="muted xs">${cnt(k)}회</span></span>${track(v, max, css('--c-var'))}<span class="tnum small" style="text-align:right"><b>${man(v)}</b></span></div>`).join('');
}

function calendarCells(c) {
  const { y, m } = c, first = new Date(y, m - 1, 1).getDay();
  const exDay = groupSum(c.ex, t => +t.날짜.slice(8, 10)), inDay = groupSum(c.inc, t => +t.날짜.slice(8, 10));
  const vals = [...exDay.values()].filter(v => v > 0).sort((a, b) => a - b);
  const q = k => vals.length ? vals[Math.min(vals.length - 1, Math.floor(vals.length * k))] : 0;
  const cuts = [q(.2), q(.4), q(.6), q(.8)];
  const bin = v => (v <= 0 ? 0 : 1 + cuts.filter(cut => v > cut).length);
  const [ty, tm, td] = todayYM();
  let html = DOW.map((d, i) => `<div class="dow${i === 0 ? ' sun' : i === 6 ? ' sat' : ''}">${d}</div>`).join('');
  for (let i = 0; i < first; i++) html += '<div class="cell blank"></div>';
  for (let d = 1; d <= c.days; d++) {
    const e = exDay.get(d) || 0, b = bin(e), future = d > c.elapsed, wd = (first + d - 1) % 7;
    html += `<div class="cell ${y === ty && m === tm && d === td ? 'today' : ''} ${future ? 'future' : ''} ${b >= 4 ? 'hot' : ''} ${wd === 0 || wd === 6 ? 'wknd' : ''}" data-d="${d}"
      style="${b ? `background:var(--s${b})` : ''}" title="${m}/${d} 지출 ${won(e)}">
      <span class="d">${d}</span>${inDay.get(d) ? '<i class="inc" title="수입"></i>' : ''}
      ${e ? `<span class="v">${man(e)}</span>` : !future && c.tx.length ? '<span class="zero"><i class="stamp">무지출</i></span>' : ''}</div>`;
  }
  return html;
}

function upcomingList(y, m) {
  const c = calc(y, m), [ty, tm, td] = todayYM(), isCur = y === ty && m === tm;
  const fx = c.fixedItems.filter(f => fxAmt(f, m) && isActive(f)).map(f => ({ d: payDay(f.결제일, y, m), name: f.항목, amt: fxAmt(f, m), kind: '고정 · ' + (f.결제수단 || '') }));
  const inst = c.exAll.filter(t => t.할부ID).map(t => ({ d: +t.날짜.slice(8, 10), name: t.내용 || t.소분류, amt: t.금액, kind: '할부 ' + t.할부회차 }));
  return fx.concat(inst).filter(x => !isCur || (x.d || 99) >= td).sort((a, b) => (a.d || 99) - (b.d || 99));
}
function upcomingTotal(y, m) { const l = upcomingList(y, m); return l.length ? `${l.length}건 · ${won(sum(l, x => x.amt))}` : ''; }
function upcomingHtml(y, m) {
  const [ty, tm, td] = todayYM(), isCur = y === ty && m === tm;
  const list = upcomingList(y, m);
  if (!list.length) return `<div class="empty">${isCur ? '이번 달 남은 결제가 없어요' : '결제 일정이 없어요'}</div>`;
  return `<div style="max-height:288px;overflow:auto">${list.map(x => {
    const dd = isCur && x.d ? x.d - td : null;
    return `<div class="li"><span class="badge-d ${dd != null && dd <= 3 ? 'soon' : ''}">${dd == null ? (x.d ? x.d + '일' : '-') : dd === 0 ? '오늘' : 'D-' + dd}</span>
      <div class="main"><b>${esc(x.name)}</b><small>${x.d ? m + '월 ' + x.d + '일 · ' : ''}${esc(x.kind)}</small></div><span class="amt">${w(x.amt)}</span></div>`;
  }).join('')}</div>`;
}

function insights(c, p) {
  const out = [];
  if (c.elapsed && c.tx.length) {
    const spentDays = new Set(c.ex.filter(t => +t.날짜.slice(8, 10) <= c.elapsed).map(t => t.날짜));
    out.push(`무지출 데이 <b>${c.elapsed - spentDays.size}일</b> (지난 ${c.elapsed}일 중)`);
  }
  if (c.elapsed && p.ex.length) {
    const pSame = sum(p.ex.filter(t => +t.날짜.slice(8, 10) <= c.elapsed), t => t.금액), d = c.variable - pSame;
    if (pSame) out.push(`지난달 같은 기간(1~${c.elapsed}일)보다 <b class="${d > 0 ? 'delta-up' : 'delta-down'}">${man(Math.abs(d))}원 ${d > 0 ? '더' : '덜'}</b> 썼어요`);
  }
  const devs = expCats().map(cat => ({ cat, cur: catSum(c, cat), avg: avgPrev(c.y, c.m, x => catSum(x, cat)) }))
    .filter(x => x.avg > 10000 && x.cur > x.avg).sort((a, b) => (b.cur - b.avg) - (a.cur - a.avg))[0];
  if (devs) out.push(`<b>${esc(devs.cat)}</b>가 평소(3개월 평균)보다 <b class="delta-up">${man(devs.cur - devs.avg)}원</b> 많아요`);
  const save = sum(c.ex.filter(t => t.지출평가 === '절약 가능'), t => t.금액);
  if (c.variable) out.push(`'절약 가능'으로 표시한 지출이 <b>${won(save)}</b> (${pct(save, c.variable)})`);
  const big = [...c.ex].sort((a, b) => b.금액 - a.금액)[0];
  if (big) out.push(`가장 큰 지출: ${esc(big.내용 || big.소분류)} <b>${won(big.금액)}</b>`);
  if (c.pointUsed) out.push(`복지포인트로 <b>${won(c.pointUsed)}</b> 결제 (지출 집계에서 제외)`);
  return out.map((t, i) => `<div class="insight"><span class="n">${i + 1}</span><span>${t}</span></div>`).join('') || '<div class="empty">데이터가 쌓이면 보여드릴게요</div>';
}

function topSubsHtml(c) {
  const cur = sortedEntries(groupSum(c.ex, t => t.대분류 + '|' + t.소분류)).slice(0, 6);
  if (!cur.length) return '<div class="empty">이번 달 지출이 없어요</div>';
  const max = cur[0][1];
  return cur.map(([k, v]) => {
    const [b, s] = k.split('|');
    const avg = avgPrev(c.y, c.m, x => sum(x.ex.filter(t => t.대분류 === b && t.소분류 === s), t => t.금액));
    return `<div class="rank"><span class="ellipsis"><i class="dot" style="background:${catColor(b)};margin-right:6px"></i>${esc(s)} <span class="muted xs">${esc(b)}</span></span>
      ${track(v, max, catColor(b))}<span class="tnum small" style="min-width:110px;text-align:right"><b>${man(v)}</b> ${avg ? deltaTxt(v, avg, false, true) : ''}</span></div>`;
  }).join('');
}

/* 카드 자동등록 상태 — 홈이 뜬 뒤 따로 조회 (5분 캐시) */
function cardStatusHtml() {
  const s = S.cardStatus;
  if (!s) return '<div class="small sub">수신 기록을 확인하고 있어요.</div>';
  if (s.error) return `<div class="small sub">수신 기록을 불러오지 못했어요. <span class="muted xs">${esc(s.error)}</span></div>`;
  if (!s.configured) return '<div class="empty">아직 카드 수신 기록 시트가 없어요</div>';
  const last = s.recent[0];
  const days = last && last.수신일시 ? Math.round((dateOf(S.today) - dateOf(last.수신일시.slice(0, 10))) / 86400000) : null;
  const ago = days == null ? '' : days <= 0 ? '오늘' : days === 1 ? '어제' : days + '일 전';
  const st = s.review ? status('warn', `확인 필요 ${s.review}건`)
    : !last ? status('warn', '수신 기록 없음')
    : days >= 3 ? status('warn', `${days}일째 등록 없음`) : status('good', '정상 수신');
  const c = s.counts || {};
  const chips = [['ok', '정상 등록', 'good'], ['fail', '해석 실패', 'bad'], ['dup', '중복 수신', ''], ['review', '확인 필요', 'warn']]
    .map(([k, t, tone]) => `<span class="card-chip ${c[k] ? tone : ''}">${t} <b>${c[k] || 0}</b></span>`).join('');
  return `<div class="between small">${st}<span class="muted">${last ? `마지막 수신 ${ago}` : ''} · 누적 ${s.count}건</span></div>
    <div class="card-chips">${chips}</div>
    ${s.recent.length ? `<div class="mt">${s.recent.map(cardRowHtml).join('')}</div>` : ''}
    <div class="xs muted mt">최근 200건 기준 · 해석 실패는 수신기 업데이트 뒤부터 기록돼요. 결제했는데 몇 분 지나도 안 보이면 알려주세요.</div>`;
}
const cardRowHtml = r => `<div class="li"><div class="main"><b>${esc(r.가맹점 || (r.kind === 'fail' ? '알림 해석 실패' : '-'))}</b><small>${r.승인일 ? `${esc(r.승인일.slice(5).replace('-', '/'))} ${esc(r.승인시각)} 승인` : `${esc(r.수신일시.slice(5, 16))} 수신`}${r.kind && r.kind !== 'ok' ? ` · <span style="color:var(--${r.kind === 'fail' ? 'bad' : 'warn'}-ink)">${esc(r.상태)}</span>` : ''}</small></div><span class="amt">${r.금액 ? w(r.금액) : ''}</span></div>`;
async function loadCardStatus(force) {
  if (!force && S.cardStatus && Date.now() - S.cardStatusAt < 300000) return;
  try { S.cardStatus = await api('getCardStatus'); }
  catch (e) { S.cardStatus = { error: e && e.message ? e.message : String(e) }; }
  S.cardStatusAt = Date.now();
  if (S.view === 'home' && $('#cardStatus')) $('#cardStatus').innerHTML = cardStatusHtml();
  if (S.view === 'review' && $('#rvCard')) $('#rvCard').innerHTML = cardIssuesHtml();
}
function etaText(y) {
  const goal = num(setting('목표순자산')), ms = assetMonths(y);
  if (ms.length < 2) return '';
  const a = assetTotals(assetBalanceRows(y, ms[0])).net, b = assetTotals(assetBalanceRows(y, ms[ms.length - 1])).net;
  const per = (b - a) / (ms[ms.length - 1] - ms[0]);
  if (per <= 0) return '최근 순자산이 늘지 않고 있어요';
  const left = goal - b; if (left <= 0) return '';
  const n = Math.ceil(left / per); let yy = y, mm = ms[ms.length - 1];
  for (let i = 0; i < n; i++) [yy, mm] = nextYM(yy, mm);
  return `월평균 +${man(per)} 속도면 <b>${yy}년 ${mm}월</b>쯤 달성`;
}

function payHtml(c) {
  const m = c.m;
  const pays = uniq(refVals('결제수단').concat(c.fixedItems.map(f => f.결제수단)).concat(c.exAll.map(t => t.결제수단))).filter(Boolean);

function drawAnalysis(y, m) {
  const [ty, tm] = todayYM(), c = calc(y, m);
  // 요일 패턴 (최근 12주)
  const end =y === ty && m === tm ? S.today : ymd(y, m, c.days), start = addDays(end, -83);
  const recent = D().거래내역.filter(t => t.구분 === '지출' && !isPointPay(t) && t.날짜 >= start && t.날짜 <= end);
  const dowAvg = DOW.map((_, i) => sum(recent.filter(t => dowOf(t.날짜) === i), t => t.금액) / 12);
  const maxI = dowAvg.indexOf(Math.max(...dowAvg));
  mkChart('cDow', { type: 'bar', data: { labels: DOW, datasets: [{ label: '평균', data: dowAvg, backgroundColor: dowAvg.map((_, i) => (i === maxI ? css('--accent') : css('--s1'))), barPercentage: .7 }] },
    options: { scales: { x: xCat(), y: yMoney() } } });
  const wk = (dowAvg[0] + dowAvg[6]) / 2, wd = sum(dowAvg.slice(1, 6)) / 5;
  $('#dowNote').innerHTML = recent.length ? `<b>${DOW[maxI]}요일</b>에 가장 많이 써요 · 주말 하루 평균은 평일의 <b>${wd ? (wk / wd).toFixed(1) : '-'}배</b>` : '';

  // 절약 가능 비중 6개월
  const six = prevMonths(y, m, 5).reverse().concat([[y, m]]);
  const rates = six.map(([a, b]) => { const x = calc(a, b); return x.variable ? +(sum(x.ex.filter(t => t.지출평가 === '절약 가능'), t => t.금액) / x.variable * 100).toFixed(1) : null; });
  mkChart('cSavable', { type: 'bar', data: { labels: six.map(([a, b]) => b + '월'), datasets: [{ label: '비중', data: rates, backgroundColor: rates.map((_, i) => (i === 5 ? css('--c-var') : css('--surface-3'))), barPercentage: .6 }] },
    options: { plugins: { tooltip: { callbacks: { label: x => ` 절약 가능 ${x.parsed.y}%` } } }, scales: { x: xCat(), y: { beginAtZero: true, max: 100, border: { display: false }, grid: { color: css('--grid') }, ticks: { stepSize: 25, callback: v => v + '%' } } } } });
  const valid = rates.slice(0, 5).filter(v => v != null), avgR = valid.length ? sum(valid) / valid.length : null;
  $('#savableNote').innerHTML = rates[5] != null && avgR != null ? `이번 달 <b>${rates[5]}%</b> · 지난 5개월 평균 ${avgR.toFixed(0)}% ${rates[5] <= avgR ? status('good', '개선') : status('warn', '증가')}` : '';

  // 12개월 — 기록이 시작되기 전의 빈 달은 앞에서 잘라냄
  const all12 = prevMonths(y, m, 11).reverse().concat([[y, m]]);
  const first = all12.findIndex(([a, b]) => { const x = calc(a, b); return x.tx.length || x.fixed || x.saving; });
  const pts = all12.slice(first < 0 ? 11 : first), cs = pts.map(([a, b]) => calc(a, b));
  mkChart('cTrend', { data: { labels: pts.map(([a, b]) => (b === 1 ? `${String(a).slice(2)}년 ` : '') + b + '월'),
    datasets: [
      { type: 'line', label: '수입', data: cs.map(x => x.income || null), borderColor: css('--c-income'), backgroundColor: css('--c-income'), pointRadius: 2.5, order: 0, spanGaps: true },

    options: { interaction: { mode: 'index', intersect: false }, scales: { x: xCat({ stacked: true }), y: yMoney({ stacked: true }) } } });

function filteredTx(base) {

  if (f.type) list = list.filter(t => t.구분 === f.type);
  if (f.cat) list = list.filter(t => t.대분류 === f.cat);
  if (f.pay) list = list.filter(t => t.결제수단 === f.pay);
  if (f.q) { const q = f.q.toLowerCase(); list = list.filter(t => [t.내용, t.소분류, t.대분류, t.결제수단].join(' ').toLowerCase().includes(q)); }
  return list.sort((a, b) => b.날짜.localeCompare(a.날짜) || String(b.등록일시 || '').localeCompare(String(a.등록일시 || '')));
}

        return `<div class="day-h"><span>${+d.slice(5, 7)}.${+d.slice(8, 10)} ${DOW[dowOf(d)]}</span><span class="mini"><b style="width:${ds / maxDay * 100}%"></b></span><span class="tnum">${ds ? '−' + w(ds) : ''}</span></div>${arr.map(txRow).join('')}`;
      }).join('') || '<div class="empty">조건에 맞는 거래가 없어요</div>');
  };
  draw();
  $('#txQ').oninput = e => { S.txf.q = e.target.value; draw(); };
  $$('#txType button').forEach(b => (b.onclick = () => { S.txf.type = b.dataset.v; render(); }));
  $$('[data-cat]').forEach(b => (b.onclick = () => { S.txf.cat = S.txf.cat === b.dataset.cat ? '' : b.dataset.cat; render(); }));
  $('#txPay').onchange = e => { S.txf.pay = e.target.value; render(); };
  $('#txAll').onchange = e => { S.txf.all = e.target.checked; render(); };
  if ($('#txReset')) $('#txReset').onclick = () => { S.txf = { q: '', type: '', cat: '', pay: '', all: S.txf.all }; render(); };
};

/* 거래 입력 폼 — 모달과 거래내역 화면 상시 패널에서 공용 */
function lastPay() {
  if (S.last.결제수단) return S.last.결제수단;
  const t = [...D().거래내역].filter(x => x.구분 === '지출' && x.결제수단 && x.날짜 <= S.today).sort((a, b) => b.날짜.localeCompare(a.날짜))[0];
  return t ? t.결제수단 : refVals('결제수단')[0] || '';
}
function historyMap() {
  const mp = new Map();
  [...D().거래내역].sort((a, b) => b.날짜.localeCompare(a.날짜)).forEach(t => { if (t.내용 && !mp.has(t.내용)) mp.set(t.내용, t); });
  return mp;
}
function frequentList() {
  const lim = addDays(S.today, -120), mp = new Map();
  [...D().거래내역].filter(t => t.구분 === '지출' && t.날짜 >= lim && t.날짜 <= S.today && t.내용 && !t.할부ID).sort((a, b) => b.날짜.localeCompare(a.날짜))
    .forEach(t => { const o = mp.get(t.내용) || { t, n: 0 }; o.n++; mp.set(t.내용, o); });
  return [...mp.values()].filter(o => o.n >= 2).sort((a, b) => b.n - a.n).slice(0, 8);
}
function openTxForm(tx, preset) {
  openModal(tx ? '거래 수정' : '거래 추가', '<div id="mForm"></div>');
  buildTxForm($('#mForm'), { tx, preset });
}
function buildTxForm(host, { tx, preset, inline }) {
  const q = s => host.querySelector(s), qa = s => [...host.querySelectorAll(s)];
  const [ty, tm, td] = todayYM();
  const defDate = S.last.날짜 || (S.y === ty && S.m === tm ? S.today : ymd(S.y, S.m, Math.min(td, daysIn(S.y, S.m))));
  const f = Object.assign({ 구분: '지출', 날짜: defDate, 금액: '', 대분류: '', 소분류: '', 내용: '', 결제수단: lastPay(), 지출평가: '필수', 포인트구분: '', 할부: 1 }, preset || {}, tx || {});
  const hist = historyMap(), listId = 'memo' + Math.random().toString(36).slice(2, 7);
  const freq = tx ? [] : frequentList();

  const draw = () => {
    const inc = f.구분 === '수입';
    if (inc) f.대분류 = refVals('수입')[0] || '수입';
    const subs = f.대분류 ? subsOf(inc ? '수입' : '지출', f.대분류) : [];
    host.innerHTML = `
      <div class="between" style="margin-bottom:8px">
        <div class="seg" data-g="type">${['지출', '수입'].map(v => `<button data-v="${v}" class="${f.구분 === v ? 'on' : ''}">${v}</button>`).join('')}</div>
        <div class="row"><input type="date" class="inp" data-i="date" value="${f.날짜}" style="width:auto;padding:6px 10px">
          <button class="btn sm ghost" data-i="yest">어제</button></div>
      </div>
      <input class="inp amt" data-i="amt" inputmode="numeric" placeholder="0원" value="${f.금액 ? w(f.금액) : ''}">
      <div class="quick">${[1000, 5000, 10000, 50000].map(v => `<button data-add="${v}">+${man(v)}</button>`).join('')}<button data-add="0">지우기</button></div>
      ${freq.length && !inline ? `<div class="field mt"><label>자주 쓰는 내역</label><div class="chips">${freq.slice(0, 6).map(({ t }, i) => `<button class="chip" data-freq="${i}">${esc(t.내용)} <span class="muted">${man(t.금액)}</span></button>`).join('')}</div></div>` : ''}
      <div class="field mt"><label>내용</label><input class="inp" data-i="memo" list="${listId}" placeholder="예전 내용을 고르면 분류가 자동으로 채워져요" value="${esc(f.내용)}">
        <datalist id="${listId}">${[...hist.keys()].slice(0, 300).map(k => `<option value="${esc(k)}">`).join('')}</datalist></div>
      ${inc ? '' : `<div class="field"><label>분류</label><div class="chips" data-g="big">${expCats().map(b => `<button class="chip ${f.대분류 === b ? 'on' : ''}" data-v="${b}"><i class="dot" style="background:${catColor(b)}"></i>${b}</button>`).join('')}</div></div>`}
      ${f.대분류 ? `<div class="field"><label>${inc ? '수입 항목' : '세부'}</label><div class="chips" data-g="sub">${subs.map(s => `<button class="chip ${f.소분류 === s ? 'on' : ''}" data-v="${s}">${s}</button>`).join('')}</div></div>` : ''}
      ${inc ? '' : `
      <div class="field"><label>결제수단</label><div class="chips" data-g="pay">${refVals('결제수단').map(b => `<button class="chip ${f.결제수단 === b ? 'on' : ''}" data-v="${b}">${b}</button>`).join('')}</div></div>
      ${!tx && canInstall(f) ? `<div class="field"><label>할부 <span class="muted" style="font-weight:400">— 금액은 총 결제금액</span></label>
        <div class="chips" data-g="inst">${INST_OPTS.map(n => `<button class="chip ${f.할부 === n ? 'on' : ''}" data-v="${n}">${n === 1 ? '일시불' : n + '개월'}</button>`).join('')}
          <input class="inp" data-i="instN" inputmode="numeric" placeholder="직접(개월)" style="width:100px;padding:5px 10px" value="${INST_OPTS.includes(f.할부) ? '' : f.할부}"></div>
        <div class="small sub" style="margin-top:6px" data-i="instInfo"></div></div>` : ''}
      ${tx && f.할부ID ? `<div class="field"><span class="tag accent">할부 ${esc(f.할부회차)}</span>
        <span class="small sub"> 총 ${won(sum(D().거래내역.filter(t => t.할부ID === f.할부ID), t => t.금액))} · 분류·내용·결제수단은 모든 회차에 적용</span></div>` : ''}
      ${f.결제수단 === '복지포인트' ? `<div class="field"><label>포인트 구분</label><div class="chips" data-g="pt">${refVals('포인트구분').map(b => `<button class="chip ${f.포인트구분 === b ? 'on' : ''}" data-v="${b}">${b}</button>`).join('')}</div></div>` : ''}
      <div class="field"><label>지출 성격</label><div class="seg" data-g="eval">${refVals('지출평가').map(v => `<button data-v="${v}" class="${f.지출평가 === v ? 'on' : ''}">${v}</button>`).join('')}</div></div>`}
      <div class="form-foot">
        ${tx ? `<button class="btn danger" data-i="del" ${f.할부ID ? '' : 'style="margin-right:auto"'}>${f.할부ID ? '이 회차 삭제' : '삭제'}</button>` : ''}
        ${tx && f.할부ID ? '<button class="btn danger" data-i="delAll" style="margin-right:auto">할부 전체 삭제</button>' : ''}
        ${tx || inline ? '' : '<button class="btn ghost" data-i="more">저장 후 계속</button>'}
        <button class="btn ${inline ? 'block' : ''}" data-i="save">${tx ? '수정 저장' : '저장'}</button>
      </div>`;

    const amt = q('[data-i="amt"]');
    const instInfo = () => {
      const el = q('[data-i="instInfo"]'); if (!el) return;
      const n = f.할부, total = num(f.금액);
      if (n < 2) { el.innerHTML = ''; return; }
      if (!total) { el.innerHTML = `${n}개월로 나눠 매달 같은 날짜에 기록돼요`; return; }
      const base = Math.floor(total / n), first = total - base * (n - 1);
      const [sy, sm] = f.날짜.split('-').map(Number);
      const ey = sy + Math.floor((sm - 1 + n - 1) / 12), em = ((sm - 1 + n - 1) % 12) + 1;
      el.innerHTML = `월 <b>${won(base)}</b> × ${n}개월 (${sy}.${sm} ~ ${ey}.${em})${first !== base ? ` · 1회차 ${won(first)}` : ''}`;
    };
    amt.oninput = () => { const v = amt.value.replace(/[^\d]/g, ''); f.금액 = v ? +v : ''; amt.value = v ? w(v) : ''; instInfo(); };
    qa('[data-add]').forEach(b => (b.onclick = () => { const a = +b.dataset.add; f.금액 = a ? num(f.금액) + a : ''; amt.value = f.금액 ? w(f.금액) : ''; instInfo(); }));
    qa('[data-freq]').forEach(b => (b.onclick = () => { const { t } = freq[+b.dataset.freq];
      Object.assign(f, { 구분: '지출', 대분류: t.대분류, 소분류: t.소분류, 내용: t.내용, 금액: t.금액, 결제수단: t.결제수단, 지출평가: t.지출평가, 포인트구분: t.포인트구분 || '' }); draw(); }));
    q('[data-i="date"]').onchange = e => { f.날짜 = e.target.value; instInfo(); };
    q('[data-i="yest"]').onclick = () => { f.날짜 = addDays(S.today, -1); q('[data-i="date"]').value = f.날짜; instInfo(); };
    q('[data-i="memo"]').oninput = e => {
      f.내용 = e.target.value; const h = hist.get(f.내용);
      if (h && h.구분 === f.구분) {
        Object.assign(f, { 대분류: h.대분류, 소분류: h.소분류, 결제수단: h.결제수단 || f.결제수단, 지출평가: h.지출평가 || f.지출평가, 포인트구분: h.포인트구분 || '' });
        if (!f.금액 && !h.할부ID) f.금액 = h.금액;
        draw();
      }
    };
    const pick = (g, key, after) => qa(`[data-g="${g}"] [data-v]`).forEach(b => (b.onclick = () => { f[key] = b.dataset.v; if (after) after(); draw(); }));
    pick('type', '구분', () => { f.대분류 = ''; f.소분류 = ''; });
    pick('big', '대분류', () => { const s = subsOf('지출', f.대분류); f.소분류 = s.length === 1 ? s[0] : ''; });
    pick('sub', '소분류');
    pick('pay', '결제수단', () => { if (f.결제수단 !== '복지포인트') f.포인트구분 = ''; if (!canInstall(f)) f.할부 = 1; });
    pick('pt', '포인트구분');
    pick('eval', '지출평가');
    qa('[data-g="inst"] [data-v]').forEach(b => (b.onclick = () => { f.할부 = +b.dataset.v; draw(); }));
    if (q('[data-i="instN"]')) q('[data-i="instN"]').oninput = e => {
      const n = Math.min(60, +e.target.value.replace(/[^\d]/g, '') || 1);
      f.할부 = n; qa('[data-g="inst"] [data-v]').forEach(b => b.classList.toggle('on', +b.dataset.v === n)); instInfo();
    };
    instInfo();
    q('[data-i="save"]').onclick = () => submit(false);
    if (q('[data-i="more"]')) q('[data-i="more"]').onclick = () => submit(true);
    if (q('[data-i="del"]')) q('[data-i="del"]').onclick = async () => {
      if (!(await ask(f.할부ID ? `할부 ${f.할부회차} 회차만 삭제할까요?` : '이 거래를 삭제할까요?', '삭제', true))) return;
      await call('deleteTx', f.ID);
      D().거래내역 = D().거래내역.filter(t => t.ID !== f.ID);
      closeModal(); toast('삭제했어요'); render();
    };
    if (q('[data-i="delAll"]')) q('[data-i="delAll"]').onclick = async () => {
      const cnt = D().거래내역.filter(t => t.할부ID === f.할부ID).length;
      if (!(await ask(`이 할부의 ${cnt}개 회차를 모두 삭제할까요?`, '전체 삭제', true))) return;
      await call('deleteInstallment', f.할부ID);
      D().거래내역 = D().거래내역.filter(t => t.할부ID !== f.할부ID);
      closeModal(); toast(`할부 ${cnt}회차 삭제했어요`); render();
    };
  };

  const submit = async more => {
    if (!num(f.금액)) return toast('금액을 입력하세요');
    if (!f.날짜) return toast('날짜를 입력하세요');
    if (!f.대분류 || !f.소분류) return toast('분류를 선택하세요');
    if (f.결제수단 === '복지포인트' && !f.포인트구분) return toast('포인트 구분을 선택하세요');
    const inc = f.구분 === '수입';
    const payload = { ID: f.ID || '', 날짜: f.날짜, 구분: f.구분, 대분류: f.대분류, 소분류: f.소분류, 금액: num(f.금액), 내용: f.내용 || '',
      결제수단: inc ? '' : f.결제수단, 지출평가: inc ? '' : f.지출평가, 포인트구분: inc ? '' : f.포인트구분, 할부ID: f.할부ID || '', 할부회차: f.할부회차 || '',
      분류상태: '확정' };   // 직접 저장한 분류는 사용자가 확정한 것
    const btn = q('[data-i="save"]'); btn.disabled = true;
    try {
      if (!f.ID && f.할부 > 1 && canInstall(f)) {
        const rows = await call('saveInstallment', payload, f.할부), now = new Date().toISOString();
        rows.forEach(r => D().거래내역.push(Object.assign(r, { 등록일시: now })));
        toast(`${f.할부}개월 할부 등록 — 월 ${won(rows[rows.length - 1].금액)}`);
      } else {
        const saved = await call('saveTx', payload, !!payload.할부ID);
        saved.등록일시 = saved.등록일시 || new Date().toISOString();
        const i = D().거래내역.findIndex(t => t.ID === saved.ID);
        if (i >= 0) D().거래내역[i] = Object.assign(D().거래내역[i], saved); else D().거래내역.push(saved);
        if (saved.할부ID) D().거래내역.filter(t => t.할부ID === saved.할부ID).forEach(t => INST_SYNC.forEach(h => (t[h] = saved[h])));
        toast(`${f.구분} ${won(saved.금액)} 저장했어요`);
      }
      if (!tx) S.last = { 날짜: f.날짜, 결제수단: inc ? S.last.결제수단 : f.결제수단 };
      if (more) { render(); Object.assign(f, { ID: '', 금액: '', 내용: '', 할부: 1 }); draw(); }
      else { if (!inline) closeModal(); render(); }
    } finally { if (btn.isConnected) btn.disabled = false; }
  };
  draw();
  if (!tx && !inline) setTimeout(() => q('[data-i="amt"]') && q('[data-i="amt"]').focus(), 60);
}

/* ═════════════ 3. 고정지출 ═════════════ */
function vFixed() {
  const { y, m } = S, [ty, tm, td] = todayYM(), isCur = y === ty && m === tm;
  const all = fixedOf(y), items = S.fixAll ? all : all.filter(isActive);
  const monthly = sum(all, f => fxAmt(f, m));
  const subs = all.filter(f => isActive(f) && f.대분류 === '기타' && fxAmt(f, m));
  const savable = all.filter(f => isActive(f) && f.지출평가 === '절약 가능' && fxAmt(f, m));
  const next = isCur ? upcomingList(y, m).find(x => x.kind.startsWith('고정') && x.d) : null;
  const groups = uniq(refVals('고정대분류').concat(items.map(f => f.대분류)));
  const groupTot = groups.map((g, i) => ({ g, v: sum(all.filter(f => f.대분류 === g), f => fxAmt(f, m)), c: pal(i) })).filter(x => x.v);
  const yearTotal = f => sum(MONTHS.map((_, i) => fxAmt(f, i + 1)));
  const spark = f => { const vals = MONTHS.map((_, i) => fxAmt(f, i + 1)), mx = Math.max(1, ...vals);
    return `<span class="spark hide-m" title="1~12월">${vals.map((v, i) => `<i class="${i + 1 === m ? 'cur' : ''}" style="height:${Math.max(4, v / mx * 100)}%;${v ? '' : 'opacity:.25'}"></i>`).join('')}</span>`; };
  return `
  <div class="strip">
    <div><div class="eyebrow">${m}월 고정지출</div><div class="mid">${yen(monthly)}</div></div>
    <div><div class="eyebrow">구독·멤버십 (기타)</div><div class="mid">${subs.length}<span class="unit">개</span> <span class="small sub">${won(sum(subs, f => fxAmt(f, m)))}</span></div></div>
    <div><div class="eyebrow">절약 가능 항목</div><div class="mid">${yen(sum(savable, f => fxAmt(f, m)))}</div><div class="xs muted">해지하면 연 ${man(sum(savable, f => fxAmt(f, m)) * 12)}원</div></div>
    <div><div class="eyebrow">다음 결제</div>${next ? `<div class="mid">${next.d - td === 0 ? '오늘' : 'D-' + (next.d - td)}</div><div class="xs muted ellipsis">${esc(next.name)} ${won(next.amt)}</div>` : '<div class="mid muted">-</div>'}</div>
  </div>

  <div class="card mt">
    <div class="card-h"><h3>${m}월 결제 타임라인</h3>${legendHtml([['고정지출', css('--c-fixed')], ['할부', css('--c-var')]]).replace('legend mt', 'legend')}</div>
    ${timelineHtml(y, m)}
  </div>

  <div class="g mt">
    <div class="card c8">
      <div class="toolbar">
        <div class="seg" id="fxAll"><button data-v="0" class="${S.fixAll ? '' : 'on'}">사용중</button><button data-v="1" class="${S.fixAll ? 'on' : ''}">해지 포함</button></div>
        <span class="grow xs muted">* 아직 입력 전인 달 — 직전 달 금액으로 예상</span>
        <button class="btn ghost sm" id="fxCopy">${y + 1}년으로 복사</button>
        <button class="btn sm" onclick="openFixedForm()">＋ 항목 추가</button>
      </div>
      ${groups.map((g, gi) => {
        const arr = items.filter(f => f.대분류 === g); if (!arr.length) return '';
        return `<div class="day-h" style="position:static"><span><i class="dot" style="background:${pal(gi)};margin-right:6px"></i>${esc(g)}</span><span class="grow"></span><span class="tnum">${w(sum(arr, f => fxAmt(f, m)))}</span></div>` +
          arr.map(f => `<div class="li click ${isActive(f) ? '' : 'dim'}" style="${isActive(f) ? '' : 'opacity:.5'}" onclick="openFixedForm('${f.ID}')">
            <div class="main"><b>${esc(f.항목)} ${isActive(f) ? '' : `<span class="tag">${esc(f.상태)}</span>`}${f.지출평가 === '절약 가능' ? ' <span class="tag">절약가능</span>' : ''}</b>
